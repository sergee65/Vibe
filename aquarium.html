<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Аквариум</title>
<style>
  :root {
    --ink: #eafcff;
    --glass: rgba(6, 30, 44, 0.55);
    --glass-border: rgba(190, 240, 255, 0.16);
    --accent: #8ff3ff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: #04384f;
  }

  body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #tank {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }

  .sheen {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(112deg,
        rgba(255, 255, 255, 0.10) 0%,
        rgba(255, 255, 255, 0.03) 17%,
        rgba(255, 255, 255, 0) 33%,
        rgba(255, 255, 255, 0) 70%,
        rgba(255, 255, 255, 0.05) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.20),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse 125% 95% at 50% 42%,
      rgba(0, 0, 0, 0) 45%,
      rgba(1, 16, 26, 0.38) 100%);
    transition: background 1.2s ease;
  }

  .brand {
    position: fixed;
    top: calc(22px + env(safe-area-inset-top, 0px));
    left: 24px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0;
    color: rgba(235, 252, 255, 0.72);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    text-shadow: 0 1px 10px rgba(0, 20, 30, 0.45);
    pointer-events: none;
    animation: fadeIn 1.4s ease 0.5s both;
  }

  .brand-mark {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(140, 240, 255, 0.85);
    animation: pulse 4s ease-in-out infinite;
  }

  .back-home {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top, 0px));
    right: 24px;
    z-index: 30;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 12px 0 10px;
    border: 1px solid rgba(180, 240, 255, 0.2);
    border-radius: 999px;
    background: rgba(3, 22, 33, 0.44);
    color: rgba(236, 252, 255, 0.88);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    -webkit-backdrop-filter: blur(12px) saturate(130%);
    backdrop-filter: blur(12px) saturate(130%);
    box-shadow: 0 6px 22px rgba(0, 10, 20, 0.2);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }

  .back-home svg {
    width: 13px;
    height: 13px;
    flex: none;
  }

  .back-home:hover {
    background: rgba(6, 40, 56, 0.64);
    border-color: rgba(160, 240, 255, 0.42);
    transform: translateY(-1px);
  }

  .back-home:active { transform: scale(0.97); }

  .back-home:focus-visible {
    outline: 2px solid rgba(160, 240, 255, 0.8);
    outline-offset: 3px;
  }

  .sound-toggle {
    position: fixed;
    top: calc(62px + env(safe-area-inset-top, 0px));
    right: 24px;
    z-index: 30;
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid rgba(180, 240, 255, 0.2);
    border-radius: 50%;
    background: rgba(3, 22, 33, 0.44);
    color: rgba(236, 252, 255, 0.88);
    cursor: pointer;
    -webkit-backdrop-filter: blur(12px) saturate(130%);
    backdrop-filter: blur(12px) saturate(130%);
    box-shadow: 0 6px 22px rgba(0, 10, 20, 0.2);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }

  .sound-toggle:hover {
    background: rgba(6, 40, 56, 0.64);
    border-color: rgba(160, 240, 255, 0.42);
    transform: translateY(-1px);
  }

  .sound-toggle:active { transform: scale(0.95); }

  .sound-toggle:focus-visible {
    outline: 2px solid rgba(160, 240, 255, 0.8);
    outline-offset: 3px;
  }

  .sound-toggle svg {
    display: block;
    width: 15px;
    height: 15px;
  }

  .snd-on { display: none; }
  .sound-toggle .snd-on { display: none; }

  .sound-toggle[aria-pressed="true"] {
    background: rgba(20, 105, 125, 0.8);
    border-color: rgba(140, 240, 255, 0.5);
    color: #effeff;
  }

  .sound-toggle[aria-pressed="true"] .snd-on { display: block; }
  .sound-toggle[aria-pressed="true"] .snd-off { display: none; }

  @media (max-width: 560px) {
    .back-home {
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 15px;
      height: 31px;
      padding: 0 10px 0 8px;
      gap: 5px;
      font-size: 9px;
    }

    .back-home svg { width: 12px; height: 12px; }

    .sound-toggle {
      top: calc(52px + env(safe-area-inset-top, 0px));
      right: 15px;
      width: 31px;
      height: 31px;
    }

    .sound-toggle svg { width: 14px; height: 14px; }
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    z-index: 9;
    margin: 0;
    max-width: min(92vw, 680px);
    padding: 7px 15px;
    transform: translate(-50%, 0);
    border: 1px solid rgba(190, 240, 255, 0.10);
    border-radius: 999px;
    background: rgba(4, 27, 40, 0.28);
    color: rgba(228, 251, 255, 0.74);
    font-size: 12px;
    letter-spacing: 0.02em;
    line-height: 1.5;
    text-align: center;
    text-shadow: 0 1px 12px rgba(0, 20, 30, 0.55);
    pointer-events: none;
    -webkit-backdrop-filter: blur(8px) saturate(130%);
    backdrop-filter: blur(8px) saturate(130%);
    animation: hintIn 1s ease 1.1s both;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .hint.hide {
    animation: none;
    opacity: 0;
    transform: translate(-50%, 7px);
  }

  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 7px 9px;
    transform: translate(-50%, 0);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    background: var(--glass);
    color: var(--ink);
    box-shadow:
      0 16px 44px rgba(0, 20, 32, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    backdrop-filter: blur(16px) saturate(150%);
    animation: dockIn 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) 0.15s both;
    transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 38px;
    padding: 0 13px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 13.5px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.12s ease;
  }

  .btn:hover { background: rgba(255, 255, 255, 0.10); }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible {
    outline: 2px solid rgba(160, 240, 255, 0.75);
    outline-offset: 2px;
  }

  .ico {
    width: 18px;
    height: 18px;
    flex: none;
    opacity: 0.95;
  }

  .ico-sun { display: none; }
  body.night .ico-sun { display: block; }
  body.night .ico-moon { display: none; }

  .sep {
    width: 1px;
    height: 22px;
    margin: 0 3px;
    background: rgba(200, 240, 255, 0.18);
  }

  .counter {
    display: flex;
    align-items: baseline;
    gap: 4px;
    padding: 0 12px 0 9px;
    color: rgba(230, 250, 255, 0.78);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .counter b {
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
  }

  body.night .dock {
    background: rgba(3, 16, 30, 0.62);
    border-color: rgba(140, 190, 255, 0.18);
    box-shadow:
      0 16px 54px rgba(0, 8, 20, 0.5),
      inset 0 1px 0 rgba(150, 200, 255, 0.14);
  }

  body.night .vignette {
    background: radial-gradient(ellipse 125% 95% at 50% 42%,
      rgba(0, 0, 0, 0) 38%,
      rgba(0, 6, 15, 0.55) 100%);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes hintIn {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  @keyframes dockIn {
    from { opacity: 0; transform: translate(-50%, 18px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }

  @media (max-width: 560px) {
    .brand {
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 16px;
      font-size: 10px;
      letter-spacing: 0.24em;
    }

    .dock { gap: 0; padding: 6px 7px; }

    .btn {
      height: 36px;
      padding: 0 10px;
      gap: 6px;
      font-size: 12.5px;
    }

    .counter {
      padding: 0 9px 0 6px;
      font-size: 11.5px;
    }

    .counter b { font-size: 13px; }

    .hint {
      bottom: calc(78px + env(safe-area-inset-bottom, 0px));
      font-size: 11px;
      max-width: 88vw;
    }

    .sep { margin: 0 1px; }
  }

  @media (max-width: 350px) {
    .btn span { display: none; }
    .btn { padding: 0 11px; }
    .counter { padding: 0 8px 0 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand, .dock, .hint, .brand-mark { animation: none; }
  }
</style>
<link rel="stylesheet" href="tihon-profile.css" />
</head>
<body>
<canvas id="tank" aria-label="Интерактивный аквариум с рыбками"></canvas>
<div class="sheen" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="brand" aria-hidden="true">
  <span class="brand-mark"></span>
  Аквариум
</header>

<a class="back-home" href="index.html?back=1" aria-label="Вернуться в главное меню">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M15 5 8 12l7 7M8 12h12"/>
  </svg>
  <span>В меню</span>
</a>

<button class="sound-toggle" id="soundBtn" type="button" aria-pressed="false" aria-label="Включить музыку и звуки" title="Включить музыку и звуки">
  <svg class="snd-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5v5h3.8l4.7 3.8V5.7L7.8 9.5H4Z"/>
    <path d="M16.2 9.4l4.6 5.2M20.8 9.4l-4.6 5.2"/>
  </svg>
  <svg class="snd-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5v5h3.8l4.7 3.8V5.7L7.8 9.5H4Z"/>
    <path d="M15.7 9.2a4 4 0 0 1 0 5.6M18.3 6.6a8 8 0 0 1 0 10.8"/>
  </svg>
</button>

<p class="hint" id="hint">Кликните по воде — корм &middot; Перетащите — течение</p>

<div class="dock" role="toolbar" aria-label="Управление аквариумом">
  <button class="btn" id="addBtn" type="button" title="Добавить рыбку (F)">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.8 12.2c2.3-3.4 5.5-5 8.6-4.2 1.7.5 3.1 1.5 4.2 3l3.9-2.8v8l-3.9-2.8a7.4 7.4 0 0 1-4.2 3c-3.1.8-6.3-.8-8.6-4.2Z"/>
      <circle cx="8.6" cy="11.1" r=".9" fill="currentColor" stroke="none"/>
    </svg>
    <span>Рыбка</span>
  </button>

  <button class="btn" id="feedBtn" type="button" title="Бросить корм (Пробел)">
    <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="8" cy="8.6" r="2.1"/>
      <circle cx="16.2" cy="7.2" r="1.5"/>
      <circle cx="12.4" cy="13.2" r="2.5"/>
      <circle cx="17" cy="16.6" r="1.8"/>
      <circle cx="7" cy="16.2" r="1.3"/>
    </svg>
    <span>Корм</span>
  </button>

  <button class="btn" id="nightBtn" type="button" aria-pressed="false" title="День / ночь (N)">
    <svg class="ico ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.6 8.6 0 1 0 10.9 10.9Z"/>
    </svg>
    <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
    </svg>
    <span id="nightLabel">Ночь</span>
  </button>

  <span class="sep" aria-hidden="true"></span>

  <div class="counter" aria-live="polite">
    <b id="fishCount">0</b>
    <span id="fishWord">рыбок</span>
  </div>
</div>

<script src="world-audio.js"></script>
<script src="tihon-profile.js"></script>
<script>
(function () {
  'use strict';

  var TAU = Math.PI * 2;
  var canvas = document.getElementById('tank');
  var ctx = canvas.getContext('2d', { alpha: false });
  var bgCanvas = document.createElement('canvas');
  var bg = bgCanvas.getContext('2d');

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function hsl(h, s, l, a) {
    return 'hsla(' + (h | 0) + ', ' + Math.round(s) + '%, ' + Math.round(l) + '%, ' + (a === undefined ? 1 : a) + ')';
  }

  var state = {
    w: 0,
    h: 0,
    dpr: 1,
    t: 0,
    sandH: 0,
    sizeScale: 1,
    night: 0,
    nightTarget: 0,
    fish: [],
    plants: [],
    specks: [],
    foods: [],
    bubbles: [],
    ripples: [],
    sparks: [],
    pointer: {
      x: -999, y: -999,
      active: false, down: false,
      moved: 0, lastX: 0, lastY: 0, lastT: 0,
      vx: 0, vy: 0
    },
    bubbleTimer: 0,
    bubbleSources: [],
    nextFishId: 0,
    maxFish: 36
  };

  var renderList = [];
  var raySprite = null;
  var hintEl = document.getElementById('hint');
  var countEl = document.getElementById('fishCount');
  var wordEl = document.getElementById('fishWord');
  var nightBtn = document.getElementById('nightBtn');
  var nightLabel = document.getElementById('nightLabel');
  var soundBtn = document.getElementById('soundBtn');
  var hintTimer = null;
  var worldAudio = window.WorldAudio ? new window.WorldAudio('aquarium') : null;

  if (worldAudio && soundBtn) worldAudio.bindButton(soundBtn);
  else if (soundBtn) soundBtn.style.display = 'none';

  if (window.TihonProfile) window.TihonProfile.visit('aquarium');

  function sandTopY(x) {
    return state.h - state.sandH + Math.sin(x * 0.008) * 6 + Math.sin(x * 0.021 + 1.7) * 3;
  }

  function addRipple(x, y, maxR, strength, surface) {
    state.ripples.push({
      x: x,
      y: y,
      maxR: maxR,
      strength: strength,
      surface: !!surface,
      age: 0,
      dur: rand(0.9, 1.5)
    });
    if (state.ripples.length > 36) state.ripples.shift();
  }

  /* ------------------------------------------------------------------ */
  /* Background                                                          */
  /* ------------------------------------------------------------------ */

  function resize() {
    state.w = Math.max(320, window.innerWidth);
    state.h = Math.max(360, window.innerHeight);
    state.dpr = Math.min(1.75, window.devicePixelRatio || 1);

    canvas.width = Math.round(state.w * state.dpr);
    canvas.height = Math.round(state.h * state.dpr);
    canvas.style.width = state.w + 'px';
    canvas.style.height = state.h + 'px';

    state.sandH = clamp(state.h * 0.155, 58, 150);
    state.sizeScale = clamp(Math.sqrt((state.w * state.h) / (1440 * 900)), 0.58, 1.05);
    state.bubbleSources = [state.w * 0.16, state.w * 0.74];

    buildBackground();
    buildPlants();
    buildSpecks();

    for (var i = 0; i < state.fish.length; i++) {
      var f = state.fish[i];
      f.x = clamp(f.x, 20, state.w - 20);
      f.y = clamp(f.y, 26, state.h - state.sandH - 18);
      f.prefY = clamp(f.prefY, 40, state.h - state.sandH - 40);
    }
  }

  function buildBackground() {
    var w = state.w;
    var h = state.h;
    var dpr = state.dpr;

    bgCanvas.width = Math.round(w * dpr);
    bgCanvas.height = Math.round(h * dpr);
    bg.setTransform(dpr, 0, 0, dpr, 0, 0);
    bg.clearRect(0, 0, w, h);

    var g = bg.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#a9f1f3');
    g.addColorStop(0.22, '#58cfdd');
    g.addColorStop(0.55, '#1597b7');
    g.addColorStop(0.82, '#0a6d8f');
    g.addColorStop(1, '#054863');
    bg.fillStyle = g;
    bg.fillRect(0, 0, w, h);

    g = bg.createRadialGradient(w * 0.48, -h * 0.22, 0, w * 0.48, -h * 0.22, h * 1.05);
    g.addColorStop(0, 'rgba(232, 255, 255, 0.55)');
    g.addColorStop(0.45, 'rgba(170, 245, 250, 0.16)');
    g.addColorStop(1, 'rgba(170, 245, 250, 0)');
    bg.fillStyle = g;
    bg.fillRect(0, 0, w, h);

    g = bg.createLinearGradient(0, 0, w, h * 0.65);
    g.addColorStop(0, 'rgba(255, 255, 255, 0.055)');
    g.addColorStop(0.4, 'rgba(255, 255, 255, 0)');
    g.addColorStop(1, 'rgba(0, 25, 40, 0.10)');
    bg.fillStyle = g;
    bg.fillRect(0, 0, w, h);

    g = bg.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, 'rgba(2, 32, 48, 0.30)');
    g.addColorStop(0.18, 'rgba(2, 32, 48, 0)');
    g.addColorStop(0.82, 'rgba(2, 32, 48, 0)');
    g.addColorStop(1, 'rgba(2, 32, 48, 0.32)');
    bg.fillStyle = g;
    bg.fillRect(0, 0, w, h);

    g = bg.createLinearGradient(0, h * 0.55, 0, h);
    g.addColorStop(0, 'rgba(2, 50, 66, 0)');
    g.addColorStop(1, 'rgba(2, 40, 55, 0.35)');
    bg.fillStyle = g;
    bg.fillRect(0, h * 0.55, w, h * 0.45);

    drawSandAndRocks(bg, w, h);
  }

  function drawSandAndRocks(c, w, h) {
    var sandH = state.sandH;
    var top = h - sandH;

    c.save();

    c.beginPath();
    c.moveTo(0, h);
    c.lineTo(0, top + 8);
    for (var x = 0; x <= w; x += 16) {
      c.lineTo(x, sandTopY(x));
    }
    c.lineTo(w, h);
    c.closePath();

    c.save();
    var g = c.createLinearGradient(0, top - 12, 0, h);
    g.addColorStop(0, '#efdfb4');
    g.addColorStop(0.32, '#dbc28f');
    g.addColorStop(1, '#a28256');
    c.fillStyle = g;
    c.fill();
    c.clip();

    c.strokeStyle = 'rgba(255, 250, 226, 0.5)';
    c.lineWidth = 2;
    c.beginPath();
    for (var sx = 0; sx <= w; sx += 16) {
      if (sx === 0) c.moveTo(sx, sandTopY(sx));
      else c.lineTo(sx, sandTopY(sx));
    }
    c.stroke();

    var speckCount = Math.min(760, Math.round(w * sandH * 0.004));
    for (var i = 0; i < speckCount; i++) {
      var px = rand(0, w);
      var py = rand(top + 6, h);
      var radius = rand(0.6, 1.9);
      c.fillStyle = Math.random() < 0.5
        ? 'rgba(88, 63, 38, ' + rand(0.07, 0.22).toFixed(3) + ')'
        : 'rgba(255, 247, 216, ' + rand(0.10, 0.32).toFixed(3) + ')';
      c.beginPath();
      c.ellipse(px, py, radius, radius * rand(0.5, 0.9), rand(0, 3), 0, TAU);
      c.fill();
    }

    var pebbleCount = Math.round(w / 68);
    for (var p = 0; p < pebbleCount; p++) {
      var gx = rand(0, w);
      var gy = rand(top + 12, h - 4);
      var gr = rand(3, 9);
      c.fillStyle = 'hsla(' + rand(25, 45).toFixed(0) + ', ' + rand(6, 16).toFixed(0) + '%, ' +
        rand(38, 60).toFixed(0) + '%, ' + rand(0.30, 0.55).toFixed(2) + ')';
      c.beginPath();
      c.ellipse(gx, gy, gr, gr * rand(0.55, 0.8), rand(0, 3), 0, TAU);
      c.fill();
      c.fillStyle = 'rgba(255, 255, 255, 0.13)';
      c.beginPath();
      c.ellipse(gx - gr * 0.25, gy - gr * 0.25, gr * 0.45, gr * 0.24, 0, 0, TAU);
      c.fill();
    }

    for (var rp = 0; rp < 5; rp++) {
      var rippleY = top + sandH * (0.2 + rp * 0.15) + rand(-4, 4);
      c.beginPath();
      for (var rxp = 0; rxp <= w; rxp += 20) {
        var ryp = rippleY + Math.sin(rxp * 0.012 + rp * 1.9) * 3 + Math.sin(rxp * 0.03 + rp) * 1.4;
        if (rxp === 0) c.moveTo(rxp, ryp);
        else c.lineTo(rxp, ryp);
      }
      c.strokeStyle = rp % 2
        ? 'rgba(88, 62, 36, 0.10)'
        : 'rgba(255, 248, 222, 0.14)';
      c.lineWidth = 1.6;
      c.stroke();
    }

    c.restore();

    var rockCount = Math.max(3, Math.round(w / 330));
    for (var r = 0; r < rockCount; r++) {
      var rx = ((r + 0.5) / rockCount) * w + rand(-w * 0.04, w * 0.04);
      var ry = top + rand(2, 14);
      var rr = rand(24, 54);
      var rh = rr * rand(0.5, 0.72);

      c.fillStyle = 'rgba(20, 45, 40, 0.22)';
      c.beginPath();
      c.ellipse(rx, ry + rh * 0.55, rr * 1.1, rh * 0.45, 0, 0, TAU);
      c.fill();

      var rg = c.createRadialGradient(rx - rr * 0.35, ry - rh * 0.8, rr * 0.08, rx, ry, rr * 1.25);
      rg.addColorStop(0, '#8b9a92');
      rg.addColorStop(0.55, '#5b6c67');
      rg.addColorStop(1, '#33423e');
      c.fillStyle = rg;
      c.beginPath();
      c.ellipse(rx, ry, rr, rh, rand(-0.14, 0.14), 0, TAU);
      c.fill();

      c.fillStyle = 'rgba(76, 128, 88, 0.32)';
      c.beginPath();
      c.ellipse(rx - rr * 0.16, ry - rh * 0.62, rr * 0.48, rh * 0.28, -0.2, 0, TAU);
      c.fill();
    }

    var starX = w * 0.35 + rand(-20, 20);
    var shellX = w * 0.9 + rand(-16, 16);
    drawStarfish(c, starX, sandTopY(starX) + rand(20, 32), rand(10, 15), rand(-0.4, 0.4));
    drawShell(c, shellX, sandTopY(shellX) + rand(26, 40), rand(6, 9), rand(-0.6, 0.6));

    if (w > 620) drawDriftwood(c, w);

    c.restore();
  }

  function drawStarfish(c, x, y, r, rot) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);

    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = i % 2 === 0 ? r : r * 0.44;
      var px = Math.cos(ang) * rad;
      var py = Math.sin(ang) * rad;
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
    c.fillStyle = 'rgba(206, 122, 82, 0.9)';
    c.fill();
    c.strokeStyle = 'rgba(120, 62, 40, 0.35)';
    c.lineWidth = 1;
    c.stroke();

    c.fillStyle = 'rgba(255, 222, 192, 0.55)';
    for (var d = 0; d < 5; d++) {
      var da = -Math.PI / 2 + d * Math.PI * 2 / 5;
      c.beginPath();
      c.arc(Math.cos(da) * r * 0.55, Math.sin(da) * r * 0.55, Math.max(0.6, r * 0.07), 0, TAU);
      c.fill();
    }
    c.restore();
  }

  function drawShell(c, x, y, r, rot) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);

    c.beginPath();
    c.arc(0, 0, r, Math.PI, TAU);
    c.quadraticCurveTo(r * 0.55, r * 0.28, 0, r * 0.28);
    c.quadraticCurveTo(-r * 0.55, r * 0.28, -r, 0);
    c.closePath();
    c.fillStyle = 'rgba(247, 236, 212, 0.92)';
    c.fill();
    c.strokeStyle = 'rgba(158, 127, 92, 0.45)';
    c.lineWidth = 1;
    c.stroke();

    for (var i = 1; i < 4; i++) {
      var a = Math.PI + (Math.PI * i) / 4;
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.92);
      c.strokeStyle = 'rgba(158, 127, 92, 0.32)';
      c.stroke();
    }
    c.restore();
  }

  function drawDriftwood(c, w) {
    var baseY = sandTopY(w * 0.64) + 4;
    var len = w * 0.26;
    var x0 = w * 0.55;
    var sc = clamp(w / 1440, 0.75, 1.1);
    var i;

    function woodStroke(pts, width, color, alpha) {
      c.beginPath();
      c.moveTo(pts[0][0], pts[0][1]);
      for (var j = 1; j < pts.length - 1; j++) {
        c.quadraticCurveTo(
          pts[j][0], pts[j][1],
          (pts[j][0] + pts[j + 1][0]) / 2,
          (pts[j][1] + pts[j + 1][1]) / 2
        );
      }
      var last = pts[pts.length - 1];
      c.lineTo(last[0], last[1]);
      c.strokeStyle = color;
      c.lineWidth = width;
      c.globalAlpha = alpha;
      c.stroke();
    }

    c.save();
    c.lineCap = 'round';
    c.lineJoin = 'round';

    var main = [
      [x0, baseY + 2],
      [x0 + len * 0.16, baseY - 26],
      [x0 + len * 0.42, baseY - 40],
      [x0 + len * 0.7, baseY - 26],
      [x0 + len, baseY - 8]
    ];
    woodStroke(main, 22 * sc, '#3a2a1d', 1);
    woodStroke(main, 15 * sc, '#5c442d', 1);

    var shine = [];
    for (i = 0; i < main.length; i++) shine.push([main[i][0], main[i][1] - 4 * sc]);
    woodStroke(shine, 5 * sc, '#8a6b4a', 0.5);

    var fork = [
      [x0 + len * 0.37, baseY - 39],
      [x0 + len * 0.33, baseY - 66],
      [x0 + len * 0.26, baseY - 90],
      [x0 + len * 0.21, baseY - 104]
    ];
    woodStroke(fork, 9 * sc, '#3a2a1d', 1);
    woodStroke(fork, 5 * sc, '#6a4f34', 0.95);

    var twig = [
      [x0 + len * 0.72, baseY - 24],
      [x0 + len * 0.78, baseY - 44],
      [x0 + len * 0.83, baseY - 58]
    ];
    woodStroke(twig, 7 * sc, '#3a2a1d', 1);
    woodStroke(twig, 4 * sc, '#6a4f34', 0.95);

    c.globalAlpha = 0.38;
    c.strokeStyle = '#261a12';
    c.lineWidth = 1.1;
    for (var b = 0; b < 4; b++) {
      c.beginPath();
      c.moveTo(x0 + len * (0.08 + b * 0.02), baseY - 5 - b * 4);
      c.bezierCurveTo(
        x0 + len * 0.35, baseY - 26 - b * 7,
        x0 + len * 0.62, baseY - 30 - b * 4,
        x0 + len * (0.9 - b * 0.02), baseY - 12 - b * 3
      );
      c.stroke();
    }

    c.globalAlpha = 0.5;
    c.fillStyle = '#261a12';
    c.beginPath();
    c.ellipse(x0 + len * 0.58, baseY - 30 * sc, 4 * sc, 2.4 * sc, 0.1, 0, TAU);
    c.fill();

    c.fillStyle = '#4f8050';
    for (var m = 0; m < 9; m++) {
      var mx = x0 + len * rand(0.06, 0.94);
      var my = baseY - rand(16, 40) * sc;
      c.globalAlpha = rand(0.22, 0.46);
      c.beginPath();
      c.ellipse(mx, my, rand(5, 14) * sc, rand(2.5, 6) * sc, rand(-0.3, 0.3), 0, TAU);
      c.fill();
    }

    c.restore();
  }

  function buildSpecks() {
    state.specks.length = 0;
    var n = clamp(Math.round((state.w * state.h) / 22000), 26, 90);
    for (var i = 0; i < n; i++) {
      state.specks.push({
        x: rand(0, state.w),
        y: rand(0, state.h),
        z: rand(0.15, 1),
        vy: rand(-9, -2.5),
        drift: rand(4, 14),
        phase: rand(0, TAU)
      });
    }
  }

  /* ------------------------------------------------------------------ */
  /* Plants                                                              */
  /* ------------------------------------------------------------------ */

  function buildPlants() {
    state.plants.length = 0;
    var w = state.w;
    var count = clamp(Math.round(w / 118), 7, 18);

    for (var i = 0; i < count; i++) {
      var x = ((i + 0.5) / count) * w + rand(-w * 0.025, w * 0.025);
      var forcedType = w < 700
        ? (i % 3 === 0 ? 'bush' : null)
        : (i % 4 === 1 ? 'bush' : null);
      state.plants.push(new Plant(x, rand(0.28, 0.82), false, null, forcedType));
    }

    var tufts = clamp(Math.round(w / 130), 5, 12);
    for (var t = 0; t < tufts; t++) {
      state.plants.push(new Plant(rand(w * 0.02, w * 0.98), rand(0.82, 0.94), false, rand(22, 52), 'grass'));
    }

    if (w >= 700) {
      state.plants.push(new Plant(w * rand(0.22, 0.3), 0.22, false, state.h * rand(0.42, 0.5), 'ribbon'));
      state.plants.push(new Plant(w * rand(0.68, 0.76), 0.22, false, state.h * rand(0.42, 0.5), 'ribbon'));
    } else {
      state.plants.push(new Plant(w * 0.5, 0.22, false, state.h * 0.36, 'ribbon'));
    }

    if (w >= 700) {
      var fgH = clamp(state.h * rand(0.13, 0.18), 90, 170);
      state.plants.push(new Plant(rand(-14, 6), 1.06, true, fgH, 'broad'));
      state.plants.push(new Plant(w - rand(-14, 6), 1.06, true, fgH, 'broad'));
    }
  }

  function Plant(x, depth, foreground, forcedH, forceType) {
    this.x = x;
    this.depth = depth;
    this.fg = foreground;
    this.baseY = sandTopY(clamp(x, 0, state.w)) + rand(2, 9);
    this.phase = rand(0, TAU);
    this.type = forceType || (foreground ? 'broad' : pick(['ribbon', 'grass', 'ribbon', 'bush', 'grass', 'ribbon']));
    this.h = forcedH || (foreground
      ? 150
      : rand(130, 340) * (0.9 + clamp(depth, 0, 1) * 0.3));
    this.hue = rand(116, 166);
    this.sat = rand(30, 52);
    this.light = foreground ? rand(12, 19) : rand(23, 38);
    this.alpha = foreground ? 0.96 : 0.5 + clamp(depth, 0, 1) * 0.48;
    this.tuft = !!forcedH && !foreground && forcedH < 70 && this.type === 'grass';
    this.ribbons = [];
    this.blades = [];
    this.leaves = [];

    var i;
    if (this.type === 'ribbon') {
      var rn = randInt(4, 6);
      for (i = 0; i < rn; i++) {
        this.ribbons.push({
          dx: rand(-30, 30),
          len: this.h * rand(0.72, 1),
          baseW: rand(6, 12),
          tipW: rand(1, 3),
          lean: rand(-48, 48),
          phase: rand(0, TAU),
          hue: this.hue + rand(-8, 8),
          light: this.light + rand(0, 14),
          alpha: rand(0.7, 0.95)
        });
      }
    } else if (this.type === 'grass') {
      var gn = this.tuft ? randInt(5, 8) : randInt(8, 15);
      for (i = 0; i < gn; i++) {
        this.blades.push({
          dx: rand(-24, 24),
          len: this.h * rand(0.4, 1),
          lean: rand(-34, 34),
          width: rand(2, 5),
          phase: rand(0, TAU),
          hue: this.hue + rand(-10, 10),
          light: this.light + rand(-3, 14),
          alpha: rand(0.65, 1)
        });
      }
    } else {
      var broad = this.type === 'broad';
      var ln = randInt(9, 12);
      var extraLeaves = [];
      for (i = 0; i < ln; i++) {
        var leaf = {
          angle: rand(-1.0, 1.0),
          len: broad ? rand(50, 80) : rand(34, 66),
          width: broad ? rand(20, 34) : rand(11, 20),
          dist: this.h * (broad ? rand(0.15, 0.65) : rand(0.1, 0.8)),
          phase: rand(0, TAU),
          hue: this.hue + rand(-6, 10),
          light: this.light + rand(0, 12),
          alpha: rand(0.65, 1)
        };
        this.leaves.push(leaf);

        if (!broad && Math.random() < 0.7) {
          extraLeaves.push({
            angle: leaf.angle + rand(-0.32, 0.32),
            len: leaf.len * rand(0.45, 0.62),
            width: leaf.width * rand(0.55, 0.75),
            dist: leaf.dist * rand(0.4, 0.65),
            phase: rand(0, TAU),
            hue: leaf.hue + rand(-4, 6),
            light: leaf.light + rand(-2, 8),
            alpha: rand(0.6, 0.95)
          });
        }
      }
      this.leaves = this.leaves.concat(extraLeaves);
    }
  }

  Plant.prototype.draw = function (c, t) {
    if (this.type === 'ribbon') this.drawRibbon(c, t);
    else if (this.type === 'grass') this.drawGrass(c, t);
    else this.drawLeaves(c, t);
  };

  Plant.prototype.drawGrass = function (c, t) {
    c.save();
    c.globalAlpha = this.alpha;
    c.lineCap = 'round';

    for (var i = 0; i < this.blades.length; i++) {
      var b = this.blades[i];
      var sway = Math.sin(t * 0.9 + this.phase + b.phase) * this.h * 0.09;
      var bx = this.x + b.dx;
      var tipX = bx + b.lean + sway;
      var tipY = this.baseY - b.len;
      var midX = bx + b.lean * 0.35 + sway * 0.35;
      var midY = this.baseY - b.len * 0.55;

      c.beginPath();
      c.moveTo(bx, this.baseY);
      c.quadraticCurveTo(midX, midY, tipX, tipY);
      c.strokeStyle = hsl(b.hue, this.sat, b.light, 0.9);
      c.lineWidth = b.width;
      c.stroke();

      if (!this.tuft) {
        c.strokeStyle = hsl(b.hue + 8, this.sat * 0.8, b.light + 15, 0.32);
        c.lineWidth = Math.max(1, b.width * 0.38);
        c.stroke();
      }
    }

    c.restore();
  };

  Plant.prototype.drawRibbon = function (c, t) {
    c.save();
    c.lineJoin = 'round';

    for (var i = 0; i < this.ribbons.length; i++) {
      var r = this.ribbons[i];
      c.globalAlpha = this.alpha * r.alpha;
      var n = 9;
      var pts = [];

      for (var k = 0; k <= n; k++) {
        var p = k / n;
        var sway = Math.sin(t * 0.62 + this.phase + p * 2.1 + r.phase) * this.h * 0.07 * p +
          Math.sin(t * 0.24 + this.phase * 1.4 + r.phase) * this.h * 0.045 * p;
        pts.push({
          x: this.x + r.dx + r.lean * p + sway,
          y: this.baseY - r.len * p,
          w: lerp(r.baseW, r.tipW, Math.pow(p, 0.7))
        });
      }

      var g = c.createLinearGradient(0, this.baseY, 0, this.baseY - r.len);
      g.addColorStop(0, hsl(r.hue, this.sat, r.light - 3, 0.95));
      g.addColorStop(0.55, hsl(r.hue + 4, this.sat + 5, r.light, 0.92));
      g.addColorStop(1, hsl(r.hue + 10, this.sat + 8, r.light + 16, 0.82));

      c.beginPath();
      c.moveTo(pts[0].x - pts[0].w, pts[0].y);
      for (var a = 1; a <= n; a++) c.lineTo(pts[a].x - pts[a].w, pts[a].y);
      for (var b = n; b >= 0; b--) c.lineTo(pts[b].x + pts[b].w, pts[b].y);
      c.closePath();
      c.fillStyle = g;
      c.fill();

      c.strokeStyle = 'rgba(8, 45, 32, 0.18)';
      c.lineWidth = 1;
      c.stroke();

      c.beginPath();
      c.moveTo(pts[0].x, pts[0].y);
      for (var d = 1; d <= n; d++) c.lineTo(pts[d].x, pts[d].y);
      c.strokeStyle = hsl(r.hue + 12, this.sat * 0.8, r.light + 20, 0.28);
      c.lineWidth = Math.max(0.8, r.baseW * 0.14);
      c.stroke();
    }

    c.restore();
  };

  Plant.prototype.drawLeaves = function (c, t) {
    c.save();
    c.lineCap = 'round';

    for (var i = 0; i < this.leaves.length; i++) {
      var leaf = this.leaves[i];
      var ang = leaf.angle + Math.sin(t * 0.75 + this.phase + leaf.phase) * 0.06;
      var dirX = Math.sin(ang);
      var dirY = -Math.cos(ang);
      var tipX = this.x + dirX * leaf.dist;
      var tipY = this.baseY + dirY * leaf.dist;
      var baseX = tipX - dirX * leaf.len * 0.42;
      var baseY = tipY - dirY * leaf.len * 0.42;
      var ctrlX = this.x + dirX * leaf.dist * 0.5;
      var ctrlY = this.baseY + dirY * leaf.dist * 0.58;

      c.globalAlpha = this.alpha * leaf.alpha;

      c.beginPath();
      c.moveTo(this.x, this.baseY);
      c.quadraticCurveTo(ctrlX, ctrlY, baseX, baseY);
      c.strokeStyle = hsl(this.hue - 4, this.sat, this.light, 0.9);
      c.lineWidth = Math.max(1.5, leaf.width * 0.14);
      c.stroke();

      c.save();
      c.translate(baseX, baseY);
      c.rotate(Math.atan2(dirY, dirX));

      var leafFill;
      if (this.fg) {
        leafFill = c.createLinearGradient(0, -leaf.width, 0, leaf.width);
        leafFill.addColorStop(0, hsl(leaf.hue + 6, this.sat + 6, leaf.light + 10, 0.98));
        leafFill.addColorStop(0.55, hsl(leaf.hue, this.sat, leaf.light, 0.97));
        leafFill.addColorStop(1, hsl(leaf.hue - 4, this.sat, leaf.light - 5, 0.95));
      } else {
        leafFill = hsl(leaf.hue, this.sat, leaf.light + 3, 0.97);
      }

      c.beginPath();
      c.moveTo(0, 0);
      c.bezierCurveTo(leaf.len * 0.22, -leaf.width, leaf.len * 0.82, -leaf.width * 0.62, leaf.len, 0);
      c.bezierCurveTo(leaf.len * 0.82, leaf.width * 0.62, leaf.len * 0.22, leaf.width, 0, 0);
      c.closePath();
      c.fillStyle = leafFill;
      c.fill();

      c.beginPath();
      c.moveTo(leaf.len * 0.06, 0);
      c.quadraticCurveTo(leaf.len * 0.55, -leaf.width * 0.08, leaf.len * 0.94, 0);
      c.strokeStyle = hsl(leaf.hue + 12, this.sat * 0.7, leaf.light + 20, 0.28);
      c.lineWidth = 1;
      c.stroke();

      c.restore();
    }

    c.restore();
  };

  /* ------------------------------------------------------------------ */
  /* Fish                                                                */
  /* ------------------------------------------------------------------ */

  var SHAPES = {
    round: { rx: 0.33, ry: 0.23, tail: 0.30, dorsal: 0.55 },
    slim: { rx: 0.37, ry: 0.155, tail: 0.34, dorsal: 0.38 },
    angel: { rx: 0.255, ry: 0.245, tail: 0.26, dorsal: 1.0 }
  };

  function Fish() {
    this.id = state.nextFishId++;
    this.depth = rand(0.22, 0.96);
    this.baseSize = rand(48, 82) * (0.9 + this.depth * 0.28) * state.sizeScale;
    this.size = this.baseSize;
    this.shapeKey = pick(['round', 'slim', 'round', 'angel', 'slim']);
    this.shape = SHAPES[this.shapeKey];

    this.x = rand(state.w * 0.12, state.w * 0.88);
    this.y = rand(0.16, 0.72) * (state.h - state.sandH);
    this.cruise = rand(30, 54) * (1.14 - this.depth * 0.2);
    this.agility = rand(2.0, 3.4);
    this.prefY = rand(0.18, 0.82) * (state.h - state.sandH - 30) + 40;
    this.prefY = clamp(
      this.prefY,
      40 + this.size * 0.25,
      state.h - state.sandH - this.size * 0.5 - 10
    );

    var dir = Math.random() < 0.5 ? -1 : 1;
    this.vx = dir * this.cruise * rand(0.5, 1);
    this.vy = rand(-8, 8);
    this.facing = dir;
    this.pitch = 0;

    this.wander = rand(0, TAU);
    this.seed = rand(0, 100);
    this.tailPhase = rand(0, TAU);
    this.bobPhase = rand(0, TAU);
    this.excite = 0;

    this.hue = pick([16, 26, 38, 46, 334, 300, 196, 174, 8, 208]) + rand(-6, 6);
    this.sat = rand(60, 92);
    this.light = rand(54, 66);

    this.colTop = hsl(this.hue, this.sat * 0.95, this.light - 18);
    this.colBody = hsl(this.hue, this.sat, this.light);
    this.colBelly = hsl(this.hue + 8, this.sat * 0.45, this.light + 26);
    this.colFin = hsl(this.hue + 10, this.sat * 0.9, this.light + 6, 0.66);
    this.colFin2 = hsl(this.hue + 18, this.sat * 0.8, this.light + 16, 0.4);

    this.alpha = 0.82 + this.depth * 0.18;
    this.stripes = Math.random() < 0.5 ? randInt(2, 4) : 0;
    this.stripeLight = this.light < 59;
  }

  Fish.prototype.update = function (dt) {
    var s = state;
    var w = s.w;
    var h = s.h;
    var fx = 0;
    var fy = 0;
    var p = s.pointer;

    var pdx = this.x - p.x;
    var pdy = this.y - p.y;
    var pd2 = pdx * pdx + pdy * pdy;
    var fleeR = 110;

    if (p.active && pd2 < fleeR * fleeR && pd2 > 4) {
      var pd = Math.sqrt(pd2);
      var fk = (1 - pd / fleeR) * 4.2;
      fx += (pdx / pd) * fk;
      fy += (pdy / pd) * fk;
    }

    if (p.down) {
      var psp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (psp > 30) {
        var ck = Math.min(2.4, psp * 0.0028);
        fx += (p.vx / psp) * ck;
        fy += (p.vy / psp) * ck;
      }
    }

    var target = null;
    var best = Infinity;
    var sense = 260;
    for (var i = 0; i < s.foods.length; i++) {
      var food = s.foods[i];
      if (food.eaten || food.dead) continue;
      var fdx = food.x - this.x;
      var fdy = food.y - this.y;
      var fd2 = fdx * fdx + fdy * fdy;
      if (fd2 < sense * sense && fd2 < best) {
        best = fd2;
        target = food;
      }
    }

    var hunting = false;
    if (target) {
      var td = Math.sqrt(best) || 1;
      fx += ((target.x - this.x) / td) * 3.6;
      fy += ((target.y - this.y) / td) * 3.6;
      hunting = true;
    }

    this.wander += (Math.random() - 0.5) * dt * 2.6;
    fx += Math.cos(this.wander) * 0.5;
    fy += Math.sin(this.wander) * 0.5;

    if (hunting) {
      fy += clamp((this.prefY - this.y) / 600, -0.2, 0.2) * 0.25;
    } else {
      fy += clamp((this.prefY - this.y) / 260, -0.6, 0.6) * 0.9;
    }

    for (var j = 0; j < s.fish.length; j++) {
      var other = s.fish[j];
      if (other === this) continue;
      var odx = this.x - other.x;
      var ody = this.y - other.y;
      var minD = (this.size + other.size) * 0.52;
      var od2 = odx * odx + ody * ody;
      if (od2 < minD * minD && od2 > 0.5) {
        var od = Math.sqrt(od2);
        var ok = (1 - od / minD) * 2.6;
        fx += (odx / od) * ok;
        fy += (ody / od) * ok;
      }
    }

    var m = this.size * 0.55 + 26;
    if (this.x < m) fx += ((m - this.x) / m) * 3;
    else if (this.x > w - m) fx -= ((this.x - (w - m)) / m) * 3;

    var top = 42;
    if (this.y < top) fy += ((top - this.y) / top) * 3;

    var floor = h - s.sandH - this.size * 0.2 - 4;
    if (this.y > floor) fy -= ((this.y - floor) / 40) * 3;

    var speed = this.cruise * (1 + this.excite * 1.1) * (hunting ? 1.55 : 1);
    var fl = Math.sqrt(fx * fx + fy * fy);
    var dvx = this.vx;
    var dvy = this.vy;

    if (fl > 0.0001) {
      dvx = (fx / fl) * speed;
      dvy = (fy / fl) * speed;
    }

    var k = 1 - Math.exp(-this.agility * dt);
    this.vx += (dvx - this.vx) * k;
    this.vy += (dvy - this.vy) * k;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    var edgeX = this.size * 0.45 + 8;
    this.x = clamp(this.x, edgeX, w - edgeX);
    this.y = clamp(this.y, 24, floor);

    if (this.x <= edgeX + 1 || this.x >= w - edgeX - 1) this.vx *= -0.6;
    if (this.y <= 25 || this.y >= floor - 1) this.vy *= -0.6;

    if (this.vx > 12) this.facing = 1;
    else if (this.vx < -12) this.facing = -1;

    var pitchTarget = clamp(Math.atan2(this.vy, Math.abs(this.vx) + 14), -0.62, 0.62);
    this.pitch += (pitchTarget - this.pitch) * (1 - Math.exp(-6 * dt));

    var sp = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    this.tailPhase += dt * (4 + sp * 0.12) * 2;
    this.bobPhase += dt * 2;
    this.excite = Math.max(0, this.excite - dt * 0.55);

    if (target && !target.eaten) {
      var ex = target.x - this.x;
      var ey = target.y - this.y;
      var eatR = this.size * 0.26 + 7;
      if (ex * ex + ey * ey < eatR * eatR) {
        target.eaten = true;
        this.excite = 1;
        this.size = Math.min(this.baseSize * 1.16, this.size + 0.55);
        spawnSparks(target.x, target.y, 5);
        addRipple(target.x, target.y, 26, 0.35);
      }
    }
  };

  Fish.prototype.draw = function (c, t) {
    var s = this.size;
    var sh = this.shape;
    var rx = sh.rx * s;
    var ry = sh.ry * s;

    c.save();
    c.translate(this.x, this.y);
    c.globalAlpha = this.alpha;

    var wobble = Math.sin(this.bobPhase) * 0.02;
    if (this.facing > 0) {
      c.rotate(this.pitch + wobble);
    } else {
      c.rotate(-this.pitch + wobble);
      c.scale(-1, 1);
    }

    var bodyPath = function () {
      c.beginPath();
      c.moveTo(rx, 0);
      c.bezierCurveTo(rx * 0.72, -ry * 1.05, -rx * 0.35, -ry, -rx, 0);
      c.bezierCurveTo(-rx * 0.35, ry, rx * 0.72, ry * 1.05, rx, 0);
      c.closePath();
    };

    var wag = Math.sin(this.tailPhase);
    var tl = s * sh.tail;

    c.save();
    c.translate(-rx * 0.92, 0);
    c.rotate(wag * 0.22);
    var tg = c.createLinearGradient(0, 0, -tl, 0);
    tg.addColorStop(0, this.colFin);
    tg.addColorStop(1, this.colFin2);
    c.fillStyle = tg;
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(-tl * 0.45, -tl * 0.58, -tl, -tl * 0.64);
    c.quadraticCurveTo(-tl * 0.52, 0, -tl, tl * 0.64);
    c.quadraticCurveTo(-tl * 0.45, tl * 0.58, 0, 0);
    c.closePath();
    c.fill();
    c.restore();

    var dorsalH = ry * sh.dorsal * 1.7;

    c.fillStyle = this.colFin;
    c.beginPath();
    c.moveTo(rx * 0.34, -ry * 0.72);
    c.quadraticCurveTo(rx * 0.02, -ry - dorsalH, -rx * 0.62, -ry * 0.5);
    c.quadraticCurveTo(-rx * 0.18, -ry * 0.62, rx * 0.34, -ry * 0.72);
    c.closePath();
    c.fill();

    c.beginPath();
    c.moveTo(rx * 0.2, ry * 0.75);
    c.quadraticCurveTo(-rx * 0.1, ry + dorsalH * 0.55, -rx * 0.55, ry * 0.6);
    c.quadraticCurveTo(-rx * 0.2, ry * 0.7, rx * 0.2, ry * 0.75);
    c.closePath();
    c.fill();

    bodyPath();
    var bodyGrad = c.createLinearGradient(0, -ry, 0, ry);
    bodyGrad.addColorStop(0, this.colTop);
    bodyGrad.addColorStop(0.5, this.colBody);
    bodyGrad.addColorStop(1, this.colBelly);
    c.fillStyle = bodyGrad;
    c.fill();

    c.save();
    bodyPath();
    c.clip();

    var sheen = c.createLinearGradient(0, -ry, 0, ry * 0.3);
    sheen.addColorStop(0, 'rgba(255, 255, 255, 0.24)');
    sheen.addColorStop(1, 'rgba(255, 255, 255, 0)');
    c.fillStyle = sheen;
    c.fillRect(-rx, -ry, rx * 2, ry * 2);

    if (this.stripes) {
      c.fillStyle = this.stripeLight ? 'rgba(255, 255, 255, 0.18)' : 'rgba(4, 30, 45, 0.16)';
      for (var i = 0; i < this.stripes; i++) {
        var sx = -rx * 0.55 + i * (rx * 1.0 / this.stripes);
        c.beginPath();
        c.ellipse(sx, 0, s * 0.026, ry * 1.15, 0.14, 0, TAU);
        c.fill();
      }
    }
    c.restore();

    c.beginPath();
    c.moveTo(rx * 0.27, -ry * 0.55);
    c.quadraticCurveTo(rx * 0.13, 0, rx * 0.27, ry * 0.55);
    c.strokeStyle = 'rgba(0, 30, 40, 0.16)';
    c.lineWidth = Math.max(1, s * 0.012);
    c.stroke();

    c.save();
    c.translate(rx * 0.32, ry * 0.25);
    c.rotate(-0.5 + Math.sin(t * 5.5 + this.seed) * 0.35);
    c.beginPath();
    c.ellipse(rx * 0.28, ry * 0.2, rx * 0.3, ry * 0.32, 0.35, 0, TAU);
    c.fillStyle = this.colFin;
    c.fill();
    c.restore();

    var ex = rx * 0.64;
    var ey = -ry * 0.24;
    var er = Math.max(2.1, s * 0.052);

    c.beginPath();
    c.arc(ex, ey, er * 1.25, 0, TAU);
    c.fillStyle = 'rgba(248, 254, 255, 0.92)';
    c.fill();

    c.beginPath();
    c.arc(ex + er * 0.1, ey, er * 0.78, 0, TAU);
    c.fillStyle = '#0b1c26';
    c.fill();

    c.beginPath();
    c.arc(ex + er * 0.38, ey - er * 0.32, er * 0.26, 0, TAU);
    c.fillStyle = 'rgba(255, 255, 255, 0.95)';
    c.fill();

    c.beginPath();
    c.moveTo(rx * 0.97, ry * 0.03);
    c.quadraticCurveTo(rx * 0.9, ry * 0.14, rx * 0.8, ry * 0.12);
    c.strokeStyle = 'rgba(10, 35, 45, 0.35)';
    c.lineWidth = Math.max(1, s * 0.012);
    c.stroke();

    c.restore();
  };

  function addFish(silent) {
    if (state.fish.length >= state.maxFish) return false;
    var fish = new Fish();
    state.fish.push(fish);
    if (!silent) {
      addRipple(fish.x, fish.y, 58, 0.5);
      updateCounter();
      if (worldAudio) worldAudio.sfx('add');
    }
    return true;
  }

  /* ------------------------------------------------------------------ */
  /* Food, bubbles, sparks                                               */
  /* ------------------------------------------------------------------ */

  function Food(x, y, vx, vy) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.r = rand(2.6, 4.2);
    this.phase = rand(0, TAU);
    this.age = 0;
    this.rest = false;
    this.restAge = 0;
    this.fade = 1;
    this.eaten = false;
    this.dead = false;
  }

  Food.prototype.update = function (dt) {
    this.age += dt;

    if (!this.rest) {
      this.vy = Math.min(this.vy + 30 * dt, 24);
      this.vx *= Math.pow(0.35, dt);
      this.x += (this.vx + Math.sin(this.age * 2.6 + this.phase) * 6) * dt;
      this.y += this.vy * dt;

      var floor = sandTopY(this.x) - 2;
      if (this.y >= floor) {
        this.y = floor;
        this.rest = true;
        this.restAge = this.age;
      }
    }

    if (this.rest && this.age - this.restAge > 7) {
      this.fade = clamp(1 - (this.age - this.restAge - 7) / 2.5, 0, 1);
      if (this.fade <= 0) this.dead = true;
    }
  };

  Food.prototype.draw = function (c) {
    var pop = clamp(this.age / 0.25, 0, 1);
    var radius = this.r * (0.6 + 0.4 * pop);
    var alpha = this.fade;

    c.save();
    c.globalAlpha = alpha;
    c.translate(this.x, this.y);

    var g = c.createRadialGradient(-radius * 0.35, -radius * 0.4, 0, 0, 0, radius * 1.5);
    g.addColorStop(0, '#fff2c4');
    g.addColorStop(0.45, '#f3bb55');
    g.addColorStop(1, '#c47a22');
    c.fillStyle = g;
    c.beginPath();
    c.arc(0, 0, radius, 0, TAU);
    c.fill();

    c.globalAlpha = 0.16 * alpha;
    c.fillStyle = '#ffd684';
    c.beginPath();
    c.arc(0, 0, radius * 2.3, 0, TAU);
    c.fill();

    c.restore();
  };

  function feedAt(x, y) {
    x = clamp(x, 20, state.w - 20);
    y = clamp(y, 30, sandTopY(x) - 8);

    if (state.foods.length > 90) {
      state.foods.splice(0, state.foods.length - 90);
    }
    var n = randInt(5, 8);
    for (var i = 0; i < n; i++) {
      state.foods.push(new Food(
        x + rand(-16, 16),
        y + rand(-12, 12),
        rand(-18, 18),
        rand(-6, 12)
      ));
    }
    addRipple(x, y, rand(60, 85), 0.55);
    if (worldAudio) worldAudio.sfx('feed');
    if (window.TihonProfile) window.TihonProfile.event('feed');
    hideHint();
  }

  function Bubble(x, y, r) {
    this.x = x;
    this.y = y;
    this.r = r;
    this.baseX = x;
    this.speed = rand(24, 58) * (0.7 + r * 0.08);
    this.phase = rand(0, TAU);
    this.wob = rand(2.5, 7);
    this.age = 0;
    this.dead = false;
  }

  Bubble.prototype.update = function (dt) {
    this.age += dt;
    this.y -= this.speed * dt;
    this.x = this.baseX + Math.sin(this.age * 2.4 + this.phase) * this.wob;

    if (this.y < 4) {
      this.dead = true;
      if (Math.random() < 0.32) addRipple(this.x, 3, rand(18, 46), 0.32, true);
    }
  };

  Bubble.prototype.draw = function (c) {
    c.beginPath();
    c.arc(this.x, this.y, this.r, 0, TAU);
    c.fillStyle = 'rgba(190, 240, 255, 0.12)';
    c.fill();
    c.strokeStyle = 'rgba(235, 255, 255, 0.5)';
    c.lineWidth = 0.9;
    c.stroke();

    c.beginPath();
    c.arc(this.x - this.r * 0.3, this.y - this.r * 0.32, Math.max(0.5, this.r * 0.26), 0, TAU);
    c.fillStyle = 'rgba(255, 255, 255, 0.85)';
    c.fill();
  };

  function Spark(x, y) {
    this.x = x;
    this.y = y;
    this.vx = rand(-30, 30);
    this.vy = rand(-55, -10);
    this.age = 0;
    this.dur = rand(0.35, 0.8);
    this.r = rand(0.7, 1.9);
  }

  Spark.prototype.update = function (dt) {
    this.age += dt;
    this.vy += 45 * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  };

  Spark.prototype.draw = function (c) {
    var p = this.age / this.dur;
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = (1 - p) * 0.8;
    c.fillStyle = '#ffe6a8';
    c.beginPath();
    c.arc(this.x, this.y, this.r * (1 - p * 0.5), 0, TAU);
    c.fill();
    c.restore();
  };

  function spawnSparks(x, y, n) {
    for (var i = 0; i < n; i++) {
      state.sparks.push(new Spark(x, y));
    }
    if (state.sparks.length > 120) state.sparks.splice(0, state.sparks.length - 120);
  }

  /* ------------------------------------------------------------------ */
  /* Scene decoration                                                    */
  /* ------------------------------------------------------------------ */

  function buildRaySprite() {
    var cw = 260;
    var ch = 900;
    raySprite = document.createElement('canvas');
    raySprite.width = cw;
    raySprite.height = ch;
    var c = raySprite.getContext('2d');

    var g = c.createLinearGradient(0, 0, 0, ch);
    g.addColorStop(0, 'rgba(225, 255, 255, 0.95)');
    g.addColorStop(0.3, 'rgba(215, 255, 255, 0.5)');
    g.addColorStop(0.72, 'rgba(200, 250, 255, 0.16)');
    g.addColorStop(1, 'rgba(200, 250, 255, 0)');
    c.fillStyle = g;
    c.fillRect(0, 0, cw, ch);

    c.globalCompositeOperation = 'destination-in';
    g = c.createLinearGradient(0, 0, cw, 0);
    g.addColorStop(0, 'rgba(255, 255, 255, 0)');
    g.addColorStop(0.26, 'rgba(255, 255, 255, 0.35)');
    g.addColorStop(0.5, 'rgba(255, 255, 255, 1)');
    g.addColorStop(0.74, 'rgba(255, 255, 255, 0.3)');
    g.addColorStop(1, 'rgba(255, 255, 255, 0)');
    c.fillStyle = g;
    c.fillRect(0, 0, cw, ch);
  }

  function drawRays(t) {
    var w = state.w;
    var h = state.h;
    var day = 1 - state.night;
    if (day <= 0.01) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (var i = 0; i < 6; i++) {
      var bx = w * (0.05 + i * 0.175) + Math.sin(t * 0.1 + i * 1.7) * w * 0.04;
      var rw = w * 0.11 + 50 + Math.sin(t * 0.16 + i) * 22;
      var alpha = (0.2 + 0.055 * Math.sin(t * 0.22 + i * 1.3)) * day;
      ctx.globalAlpha = alpha;
      ctx.save();
      ctx.translate(bx, -40);
      ctx.rotate((i % 2 ? 1 : -1) * 0.032 + Math.sin(t * 0.07 + i) * 0.012);
      ctx.drawImage(raySprite, -rw / 2, 0, rw, h * 1.15);
      ctx.restore();
    }

    for (var j = 0; j < 3; j++) {
      var cx = w * (0.25 + j * 0.25) + Math.sin(t * 0.35 + j * 2) * w * 0.04;
      var cy = h * 0.05;
      var cr = w * 0.14;
      var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
      cg.addColorStop(0, 'rgba(205, 255, 255, ' + (0.055 * day).toFixed(3) + ')');
      cg.addColorStop(1, 'rgba(205, 255, 255, 0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawSurface(t) {
    var w = state.w;
    var alpha = 0.18 * (1 - state.night * 0.6);

    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(235, 255, 255, ' + alpha.toFixed(3) + ')';
    ctx.beginPath();
    for (var x = 0; x <= w; x += 8) {
      var y = 5 + Math.sin(x * 0.012 + t * 1.1) * 3 + Math.sin(x * 0.031 - t * 0.8) * 1.6;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawSpecks(t) {
    ctx.save();
    ctx.fillStyle = '#dff9ff';
    for (var i = 0; i < state.specks.length; i++) {
      var p = state.specks[i];
      ctx.globalAlpha = 0.05 + p.z * 0.16;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 0.4 + p.z * 1.2, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawNight() {
    var n = state.night;
    if (n < 0.002) return;
    var w = state.w;
    var h = state.h;

    ctx.save();
    ctx.fillStyle = 'rgba(2, 10, 26, ' + (0.58 * n).toFixed(3) + ')';
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';
    var mx = w * 0.7;
    var my = -h * 0.1;
    var g = ctx.createRadialGradient(mx, my, 0, mx, my, h * 0.95);
    g.addColorStop(0, 'rgba(150, 200, 255, ' + (0.20 * n).toFixed(3) + ')');
    g.addColorStop(0.45, 'rgba(90, 150, 230, ' + (0.07 * n).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(80, 140, 220, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    for (var i = 0; i < 3; i++) {
      var bx = mx + (i - 1) * w * 0.16;
      g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(170, 210, 255, ' + (0.09 * n).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(170, 210, 255, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(bx - 40, 0);
      ctx.lineTo(bx + 40, 0);
      ctx.lineTo(bx + 160, h);
      ctx.lineTo(bx - 140, h);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function drawRipples() {
    for (var i = 0; i < state.ripples.length; i++) {
      var r = state.ripples[i];
      var p = clamp(r.age / r.dur, 0, 1);
      if (p >= 1) continue;
      var rad = 4 + (r.maxR - 4) * Math.sqrt(p);
      var a = (1 - p) * r.strength * 0.55;

      ctx.save();
      ctx.strokeStyle = 'rgba(215, 250, 255, ' + a.toFixed(3) + ')';
      ctx.lineWidth = r.surface ? 1 : 1.4;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, rad, rad * (r.surface ? 0.22 : 1), 0, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* ------------------------------------------------------------------ */
  /* Update / render                                                     */
  /* ------------------------------------------------------------------ */

  function update(dt) {
    var i;

    var diff = state.nightTarget - state.night;
    if (Math.abs(diff) < 0.002) state.night = state.nightTarget;
    else state.night += diff * (1 - Math.exp(-2.4 * dt));

    for (i = 0; i < state.foods.length; i++) state.foods[i].update(dt);
    state.foods = state.foods.filter(function (f) { return !f.dead && !f.eaten; });

    state.bubbleTimer -= dt;
    if (state.bubbleTimer <= 0 && state.bubbles.length < 110) {
      state.bubbleTimer = rand(0.09, 0.3);
      var src = pick(state.bubbleSources);
      var bx = src + rand(-34, 34);
      state.bubbles.push(new Bubble(bx, sandTopY(bx) + rand(1, 8), rand(1.2, 4.2)));
    }

    for (i = 0; i < state.bubbles.length; i++) state.bubbles[i].update(dt);
    state.bubbles = state.bubbles.filter(function (b) { return !b.dead; });

    for (i = 0; i < state.fish.length; i++) state.fish[i].update(dt);

    for (i = 0; i < state.sparks.length; i++) state.sparks[i].update(dt);
    state.sparks = state.sparks.filter(function (s) { return s.age < s.dur; });

    for (i = 0; i < state.ripples.length; i++) state.ripples[i].age += dt;
    state.ripples = state.ripples.filter(function (r) { return r.age < r.dur; });

    for (i = 0; i < state.specks.length; i++) {
      var p = state.specks[i];
      p.y += p.vy * dt;
      p.x += Math.sin(state.t * 0.4 + p.phase) * p.drift * dt;
      if (p.y < -4) {
        p.y = state.h + 4;
        p.x = rand(0, state.w);
      }
      if (p.x < -4) p.x = state.w + 4;
      else if (p.x > state.w + 4) p.x = -4;
    }
  }

  function render() {
    var w = state.w;
    var h = state.h;
    var t = state.t;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bgCanvas, 0, 0);
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

    drawRays(t);
    drawSurface(t);
    drawSpecks(t);

    renderList.length = 0;
    for (var i = 0; i < state.plants.length; i++) renderList.push(state.plants[i]);
    for (var j = 0; j < state.fish.length; j++) renderList.push(state.fish[j]);
    renderList.sort(function (a, b) { return a.depth - b.depth; });

    for (var k = 0; k < renderList.length; k++) {
      renderList[k].draw(ctx, t);
    }

    for (var f = 0; f < state.foods.length; f++) state.foods[f].draw(ctx);
    for (var b = 0; b < state.bubbles.length; b++) state.bubbles[b].draw(ctx);
    for (var s = 0; s < state.sparks.length; s++) state.sparks[s].draw(ctx);

    drawRipples();
    drawNight();
  }

  var lastFrame = 0;

  function frame(now) {
    if (!lastFrame) lastFrame = now;
    var dt = clamp((now - lastFrame) / 1000, 0.001, 0.045);
    lastFrame = now;

    state.t += dt;
    update(dt);
    render();

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ */
  /* Interface                                                           */
  /* ------------------------------------------------------------------ */

  function pluralFish(n) {
    var n10 = n % 10;
    var n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return 'рыбка';
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return 'рыбки';
    return 'рыбок';
  }

  function updateCounter() {
    countEl.textContent = String(state.fish.length);
    wordEl.textContent = pluralFish(state.fish.length);
  }

  function hideHint() {
    if (!hintEl || hintEl.classList.contains('hide')) return;
    hintEl.classList.add('hide');
    if (hintTimer) {
      clearTimeout(hintTimer);
      hintTimer = null;
    }
  }

  function bumpCounter() {
    var el = countEl.parentNode;
    if (el && el.animate) {
      el.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.18)' },
        { transform: 'scale(1)' }
      ], { duration: 320, easing: 'ease-out' });
    }
  }

  function toggleNight() {
    state.nightTarget = state.nightTarget > 0.5 ? 0 : 1;
    var isNight = state.nightTarget === 1;
    document.body.classList.toggle('night', isNight);
    nightBtn.setAttribute('aria-pressed', String(isNight));
    nightLabel.textContent = isNight ? 'День' : 'Ночь';
    if (worldAudio) worldAudio.sfx('night');
  }

  document.getElementById('addBtn').addEventListener('click', function () {
    if (!addFish(false)) bumpCounter();
    hideHint();
  });

  document.getElementById('feedBtn').addEventListener('click', function () {
    feedAt(rand(state.w * 0.25, state.w * 0.75), rand(state.h * 0.2, state.h * 0.4));
  });

  nightBtn.addEventListener('click', toggleNight);

  window.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName ? e.target.tagName : '';
    var key = e.key ? e.key.toLowerCase() : '';

    if (e.code === 'Space' && tag !== 'BUTTON') {
      e.preventDefault();
      feedAt(rand(state.w * 0.25, state.w * 0.75), rand(state.h * 0.2, state.h * 0.4));
    } else if ((key === 'f' || key === 'а') && tag !== 'BUTTON') {
      if (!addFish(false)) bumpCounter();
      hideHint();
    } else if (key === 'n' || key === 'т') {
      toggleNight();
    }
  });

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
    var p = pointerPos(e);
    var ptr = state.pointer;

    ptr.down = true;
    ptr.active = true;
    ptr.x = p.x;
    ptr.y = p.y;
    ptr.lastX = p.x;
    ptr.lastY = p.y;
    ptr.lastT = performance.now();
    ptr.moved = 0;
    ptr.vx = 0;
    ptr.vy = 0;

    addRipple(p.x, p.y, rand(46, 70), 0.7);
    hideHint();
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', function (e) {
    var p = pointerPos(e);
    var ptr = state.pointer;

    if (!ptr.active) {
      ptr.active = true;
      ptr.lastX = p.x;
      ptr.lastY = p.y;
      ptr.lastT = performance.now();
      ptr.x = p.x;
      ptr.y = p.y;
      return;
    }

    var now = performance.now();
    var dt = Math.max(8, now - ptr.lastT) / 1000;
    var dx = p.x - ptr.lastX;
    var dy = p.y - ptr.lastY;

    ptr.vx = dx / dt;
    ptr.vy = dy / dt;

    var sp = Math.sqrt(ptr.vx * ptr.vx + ptr.vy * ptr.vy);
    if (sp > 2200) {
      ptr.vx *= 2200 / sp;
      ptr.vy *= 2200 / sp;
    }

    if (ptr.down) {
      ptr.moved += Math.sqrt(dx * dx + dy * dy);
      if (sp > 180 && Math.random() < 0.4) {
        state.bubbles.push(new Bubble(p.x + rand(-6, 6), p.y + rand(-6, 6), rand(1, 2.6)));
      }
    }

    ptr.x = p.x;
    ptr.y = p.y;
    ptr.lastX = p.x;
    ptr.lastY = p.y;
    ptr.lastT = now;
  });

  function endPointer(e) {
    var ptr = state.pointer;
    if (!ptr.down) return;
    ptr.down = false;
    ptr.vx = 0;
    ptr.vy = 0;

    if (ptr.moved < 12) {
      var p = pointerPos(e);
      feedAt(p.x, p.y);
    }
  }

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () {
    state.pointer.down = false;
    state.pointer.vx = 0;
    state.pointer.vy = 0;
  });
  canvas.addEventListener('pointerleave', function () {
    if (!state.pointer.down) state.pointer.active = false;
  });
  window.addEventListener('blur', function () {
    state.pointer.down = false;
    state.pointer.active = false;
    state.pointer.vx = 0;
    state.pointer.vy = 0;
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resize();
      resizeTimer = null;
    }, 120);
  });

  /* ------------------------------------------------------------------ */
  /* Start                                                               */
  /* ------------------------------------------------------------------ */

  buildRaySprite();
  resize();

  var initialFish = clamp(Math.round((state.w * state.h) / 82000), 7, 18);
  for (var fi = 0; fi < initialFish; fi++) addFish(true);
  updateCounter();

  for (var bi = 0; bi < 26; bi++) {
    var bsrc = pick(state.bubbleSources);
    state.bubbles.push(new Bubble(bsrc + rand(-40, 40), rand(state.h * 0.15, state.h), rand(1, 3.5)));
  }

  window.__tank = {
    state: state,
    addFish: addFish,
    feedAt: feedAt,
    toggleNight: toggleNight
  };

  hintTimer = setTimeout(hideHint, 14000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
