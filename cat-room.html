<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Кошачья комната</title>
<style>
  :root {
    --ink: #4a3628;
    --ink-soft: #8b7460;
    --paper: #fff8ec;
    --paper-2: #f9eddd;
    --cream: #f2e2c9;
    --accent: #c9704b;
    --accent-deep: #a95434;
    --sage: #7d9271;
    --line: rgba(85, 59, 40, 0.15);
    --shadow: 0 18px 46px rgba(83, 53, 28, 0.18);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: #e6d4ba;
  }

  body {
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  button, input { font: inherit; }

  #room {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }

  body.dragging #room { cursor: grabbing; }
  body.over-cat #room { cursor: pointer; }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 120% 92% at 50% 42%,
        rgba(0, 0, 0, 0) 55%,
        rgba(68, 43, 24, 0.20) 100%),
      linear-gradient(180deg,
        rgba(255, 246, 228, 0.10) 0%,
        rgba(255, 246, 228, 0) 22%,
        rgba(70, 44, 24, 0) 82%,
        rgba(70, 44, 24, 0.10) 100%);
  }

  .brand {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top, 0px));
    left: 22px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    color: var(--ink);
    animation: fadeIn 1.2s ease 0.2s both;
  }

  .brand-paw {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    color: #fff8ec;
    background: var(--accent);
    box-shadow: 0 4px 14px rgba(169, 84, 52, 0.28);
  }

  .brand-paw svg { width: 17px; height: 17px; }

  .brand-name {
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 0 rgba(255, 250, 240, 0.5);
  }

  .back-home {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top, 0px));
    right: 22px;
    z-index: 40;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 12px 0 10px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 999px;
    background: rgba(255, 248, 236, 0.8);
    color: var(--ink);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(74, 48, 26, 0.12);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    backdrop-filter: blur(10px) saturate(120%);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .back-home svg {
    width: 13px;
    height: 13px;
    flex: none;
  }

  .back-home:hover {
    background: #fff8ec;
    border-color: rgba(169, 84, 52, 0.35);
    color: var(--accent-deep);
    transform: translateY(-1px);
  }

  .back-home:active { transform: scale(0.97); }

  .back-home:focus-visible {
    outline: 2px solid rgba(201, 112, 75, 0.7);
    outline-offset: 3px;
  }

  .sound-toggle {
    position: fixed;
    top: calc(60px + env(safe-area-inset-top, 0px));
    right: 22px;
    z-index: 40;
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    background: rgba(255, 248, 236, 0.8);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(74, 48, 26, 0.12);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    backdrop-filter: blur(10px) saturate(120%);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .sound-toggle:hover {
    background: #fff8ec;
    border-color: rgba(169, 84, 52, 0.35);
    color: var(--accent-deep);
    transform: translateY(-1px);
  }

  .sound-toggle:active { transform: scale(0.95); }

  .sound-toggle:focus-visible {
    outline: 2px solid rgba(201, 112, 75, 0.7);
    outline-offset: 3px;
  }

  .sound-toggle svg {
    display: block;
    width: 15px;
    height: 15px;
  }

  .sound-toggle .snd-on { display: none; }

  .sound-toggle[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff8ec;
  }

  .sound-toggle[aria-pressed="true"] .snd-on { display: block; }
  .sound-toggle[aria-pressed="true"] .snd-off { display: none; }

  @media (max-width: 760px) {
    .back-home {
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 15px;
      height: 31px;
      padding: 0 10px 0 8px;
      gap: 5px;
      font-size: 9px;
    }

    .back-home svg { width: 12px; height: 12px; }

    .sound-toggle {
      top: calc(52px + env(safe-area-inset-top, 0px));
      right: 15px;
      width: 31px;
      height: 31px;
    }

    .sound-toggle svg { width: 14px; height: 14px; }
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    z-index: 15;
    max-width: min(92vw, 660px);
    margin: 0;
    padding: 8px 15px;
    transform: translateX(-50%);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 999px;
    background: rgba(255, 248, 236, 0.68);
    color: rgba(74, 54, 40, 0.78);
    font-size: 12px;
    line-height: 1.45;
    letter-spacing: 0.01em;
    text-align: center;
    box-shadow: 0 6px 20px rgba(74, 48, 26, 0.10);
    -webkit-backdrop-filter: blur(8px) saturate(120%);
    backdrop-filter: blur(8px) saturate(120%);
    pointer-events: none;
    animation: hintIn 0.9s ease 1s both;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .hint.hide {
    animation: none;
    opacity: 0;
    transform: translate(-50%, 7px);
  }

  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 7px 9px;
    transform: translateX(-50%);
    border: 1px solid rgba(255, 255, 255, 0.62);
    border-radius: 999px;
    background: rgba(255, 248, 236, 0.80);
    box-shadow:
      0 16px 44px rgba(83, 53, 28, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    -webkit-backdrop-filter: blur(16px) saturate(130%);
    backdrop-filter: blur(16px) saturate(130%);
    animation: dockIn 0.8s cubic-bezier(0.2, 0.7, 0.3, 1) 0.1s both;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 38px;
    padding: 0 13px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-size: 13.5px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.12s ease, opacity 0.2s ease;
  }

  .btn:hover { background: rgba(122, 83, 52, 0.09); }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible {
    outline: 2px solid rgba(201, 112, 75, 0.7);
    outline-offset: 2px;
  }

  .btn.is-full { opacity: 0.58; }
  .btn.is-full:hover { background: rgba(122, 83, 52, 0.07); }

  .ico {
    width: 18px;
    height: 18px;
    flex: none;
  }

  .sep {
    width: 1px;
    height: 22px;
    margin: 0 3px;
    background: var(--line);
  }

  .counter {
    display: flex;
    align-items: baseline;
    gap: 4px;
    padding: 0 12px 0 9px;
    color: var(--ink-soft);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .counter b {
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
  }

  .pan {
    position: fixed;
    top: 48%;
    z-index: 18;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    padding: 0;
    transform: translateY(-50%);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 50%;
    background: rgba(255, 248, 236, 0.62);
    color: #6d513b;
    box-shadow: 0 6px 20px rgba(74, 48, 26, 0.12);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: opacity 0.25s ease, background 0.2s ease, transform 0.2s ease;
  }

  .pan svg { width: 18px; height: 18px; }
  .pan:hover { background: rgba(255, 248, 236, 0.92); }
  .pan:active { transform: translateY(-50%) scale(0.94); }
  .pan:focus-visible { outline: 2px solid rgba(201, 112, 75, 0.7); outline-offset: 2px; }
  .pan.dim { opacity: 0; pointer-events: none; }
  .pan-left { left: 16px; }
  .pan-right { right: 16px; }

  .toast {
    position: fixed;
    top: calc(22px + env(safe-area-inset-top, 0px));
    left: 50%;
    z-index: 60;
    max-width: min(88vw, 460px);
    padding: 10px 17px;
    transform: translate(-50%, -8px);
    border-radius: 999px;
    background: rgba(74, 54, 40, 0.94);
    color: #fff8ec;
    font-size: 12.5px;
    line-height: 1.4;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 10px 30px rgba(40, 24, 12, 0.25);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ---------------- editor ---------------- */

  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(52, 33, 20, 0.42);
    -webkit-backdrop-filter: blur(10px) saturate(110%);
    backdrop-filter: blur(10px) saturate(110%);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }

  .modal.open {
    opacity: 1;
    visibility: visible;
  }

  .editor-card {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr);
    width: min(920px, 100%);
    max-height: calc(100vh - 48px);
    border-radius: 28px;
    background: var(--paper);
    box-shadow: 0 34px 90px rgba(45, 26, 12, 0.32);
    overflow: hidden;
    transform: translateY(18px) scale(0.975);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  .modal.open .editor-card { transform: none; }

  .editor-close {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(74, 54, 40, 0.07);
    color: var(--ink-soft);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
  }

  .editor-close:hover { background: rgba(74, 54, 40, 0.13); color: var(--ink); }
  .editor-close:focus-visible { outline: 2px solid rgba(201, 112, 75, 0.7); outline-offset: 2px; }

  .preview-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    padding: 22px;
    background:
      radial-gradient(circle at 50% 18%, rgba(255, 252, 244, 0.9), rgba(255, 252, 244, 0) 62%),
      linear-gradient(160deg, #f2e4cf 0%, #e8d6ba 100%);
  }

  .preview-frame {
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    background:
      radial-gradient(ellipse at 50% 74%, rgba(201, 164, 121, 0.28), rgba(201, 164, 121, 0) 62%),
      linear-gradient(180deg, #f8ecd9 0%, #efdec5 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.6),
      inset 0 -18px 40px rgba(160, 115, 70, 0.08);
  }

  #preview {
    display: block;
    width: 100%;
    height: 256px;
  }

  .preview-caption {
    margin: 0;
    color: var(--ink-soft);
    font-size: 12.5px;
    line-height: 1.5;
    text-align: center;
  }

  .preview-caption b { color: var(--ink); font-weight: 600; }

  .form-panel {
    padding: 26px 28px 24px;
    overflow-y: auto;
    max-height: calc(100vh - 48px);
  }

  .editor-title {
    margin: 0 0 4px;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .editor-sub {
    margin: 0 0 18px;
    color: var(--ink-soft);
    font-size: 12.5px;
    line-height: 1.5;
  }

  .field { display: block; margin-bottom: 16px; }

  .field-label,
  .group-label {
    display: block;
    margin-bottom: 7px;
    color: var(--ink-soft);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .name-input {
    width: 100%;
    height: 42px;
    padding: 0 13px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fffdf7;
    color: var(--ink);
    font-size: 15px;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .name-input::placeholder { color: rgba(139, 116, 96, 0.65); }
  .name-input:focus {
    border-color: rgba(201, 112, 75, 0.65);
    box-shadow: 0 0 0 3px rgba(201, 112, 75, 0.13);
  }

  fieldset {
    min-width: 0;
    margin: 0 0 14px;
    padding: 0;
    border: 0;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fbf3e7;
    color: var(--ink);
    font-size: 12.5px;
    line-height: 1.2;
    cursor: pointer;
    transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.12s ease;
  }

  .chip:hover { background: #f6ead8; }
  .chip:active { transform: scale(0.97); }
  .chip[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff9ef;
  }
  .chip:focus-visible { outline: 2px solid rgba(201, 112, 75, 0.65); outline-offset: 2px; }

  .breed-note {
    min-height: 16px;
    margin: 8px 0 0;
    color: var(--ink-soft);
    font-size: 11.5px;
    line-height: 1.4;
  }

  .swatches {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }

  .swatch {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 7px 3px 6px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: var(--ink-soft);
    font-size: 10.5px;
    line-height: 1.2;
    cursor: pointer;
    transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
  }

  .swatch:hover { background: rgba(201, 112, 75, 0.07); }

  .swatch-dot {
    position: relative;
    display: block;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    box-shadow:
      inset 0 -4px 8px rgba(60, 38, 22, 0.16),
      inset 0 2px 2px rgba(255, 255, 255, 0.4),
      0 0 0 1px rgba(70, 45, 28, 0.12);
  }

  .swatch[aria-pressed="true"] {
    border-color: rgba(201, 112, 75, 0.4);
    background: rgba(201, 112, 75, 0.10);
    color: var(--ink);
  }

  .swatch[aria-pressed="true"] .swatch-dot::after {
    content: "";
    position: absolute;
    inset: -4px;
    border: 2px solid var(--accent);
    border-radius: 50%;
  }

  .swatches-eyes {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .eye-swatch {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px 6px 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fbf3e7;
    color: var(--ink-soft);
    font-size: 11.5px;
    cursor: pointer;
    transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
  }

  .eye-dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(52, 34, 20, 0.25), inset 0 -2px 3px rgba(0, 0, 0, 0.25);
  }

  .eye-swatch[aria-pressed="true"] {
    border-color: var(--accent);
    background: rgba(201, 112, 75, 0.10);
    color: var(--ink);
  }

  .editor-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
  }

  .editor-actions .spacer { flex: 1; }

  .btn-soft,
  .btn-primary {
    height: 42px;
    padding: 0 17px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
  }

  .btn-soft {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
  }

  .btn-soft:hover { background: rgba(120, 84, 54, 0.08); }

  .btn-primary {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff9ef;
    box-shadow: 0 8px 20px rgba(169, 84, 52, 0.24);
  }

  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn-soft:active, .btn-primary:active { transform: scale(0.97); }
  .btn-soft:focus-visible, .btn-primary:focus-visible {
    outline: 2px solid rgba(201, 112, 75, 0.7);
    outline-offset: 2px;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes hintIn {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  @keyframes dockIn {
    from { opacity: 0; transform: translate(-50%, 16px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  @media (max-width: 760px) {
    .modal { padding: 10px; }

    .editor-card {
      display: block;
      max-height: calc(100dvh - 20px);
      border-radius: 22px;
      overflow-y: auto;
    }

    .preview-panel {
      padding: 14px 14px 4px;
      gap: 8px;
    }

    #preview { height: 140px; }

    .preview-frame { border-radius: 16px; }

    .form-panel {
      max-height: none;
      padding: 14px 18px 16px;
      overflow: visible;
    }

    .editor-actions {
      position: sticky;
      bottom: 0;
      z-index: 2;
      margin: 14px -18px 0;
      padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, var(--paper) 72%, rgba(255, 248, 236, 0.92));
      border-top: 1px solid rgba(85, 59, 40, 0.07);
    }

    .editor-title { font-size: 23px; }
    .editor-sub { margin-bottom: 14px; }

    .editor-close { top: 9px; right: 9px; width: 30px; height: 30px; }

    .brand {
      top: calc(14px + env(safe-area-inset-top, 0px));
      left: 15px;
    }

    .brand-name { font-size: 14px; }
    .brand-paw { width: 27px; height: 27px; }

    .hint {
      bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      max-width: 90vw;
      padding: 7px 12px;
      font-size: 11px;
    }

    .pan { width: 36px; height: 36px; top: 47%; }
    .pan-left { left: 10px; }
    .pan-right { right: 10px; }

    .dock { gap: 0; padding: 6px 7px; }
    .btn { height: 36px; padding: 0 10px; font-size: 12.5px; gap: 6px; }
    .counter { padding: 0 9px 0 6px; font-size: 11.5px; }
    .counter b { font-size: 13px; }
    .sep { margin: 0 1px; }

    .toast { top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 12px; }
  }

  @media (max-width: 370px) {
    .btn span { display: none; }
    .btn { padding: 0 11px; }
    .swatches { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand, .dock, .hint { animation: none; }
  }
</style>
<link rel="stylesheet" href="tihon-profile.css" />
</head>
<body>
<canvas id="room" aria-label="Уютная комната с котиками"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="brand">
  <span class="brand-paw" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor">

  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function mix(a, b, t) { return a + (b - a) * t; }

  function rgba(hex, a) {
    var h = hex.charAt(0) === '#' ? hex.slice(1) : hex;
    if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + a + ')';
  }

  function roundRect(c, x, y, w, h, r) {
    var rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.lineTo(x + w - rr, y);
    c.quadraticCurveTo(x + w, y, x + w, y + rr);
    c.lineTo(x + w, y + h - rr);
    c.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    c.lineTo(x + rr, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - rr);
    c.lineTo(x, y + rr);
    c.quadraticCurveTo(x, y, x + rr, y);
    c.closePath();
  }

  function makeRng(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  var state = {

    drawRug(c, rng);

  function softShadow(c, x, y, rx, ry, alpha) {
    c.save();
    c.translate(x, y);
    c.scale(1, ry / Math.max(rx, 1));
    var g = c.createRadialGradient(0, 0, 0, 0, 0, Math.max(rx, 1));
    g.addColorStop(0, 'rgba(72, 46, 27, ' + alpha + ')');
    g.addColorStop(0.62, 'rgba(72, 46, 27, ' + (alpha * 0.45) + ')');
    g.addColorStop(1, 'rgba(72, 46, 27, 0)');
    c.fillStyle = g;
    c.beginPath();
    c.arc(0, 0, Math.max(rx, 1), 0, TAU);
    c.fill();
    c.restore();
  }

  function drawWall(c, rng) {
    var g = c.createLinearGradient(0, 0, 0, WORLD.floor);
    g.addColorStop(0, '#f8edda');
    g.addColorStop(0.55, '#f3e4cd');
    g.addColorStop(1, '#ecdbc2');
    c.fillStyle = g;
    c.fillRect(0, 0, WORLD.w, WORLD.floor);

    g = c.createRadialGradient(335, 250, 30, 335, 250, 640);
    g.addColorStop(0, 'rgba(255, 249, 230, 0.52)');
    g.addColorStop(1, 'rgba(255, 249, 230, 0)');
    c.fillStyle = g;
    c.fillRect(0, 0, WORLD.w, WORLD.floor);

    c.fillStyle = 'rgba(146, 117, 86, 0.05)';
    for (var x = 0; x < WORLD.w; x += 64) {
      c.fillRect(x, 30, 22, WORLD.floor - 30);

    c.strokeStyle = 'rgba(136, 118, 88, 0.10)';
    c.lineWidth = 1.2;
    for (var sx = 62; sx < WORLD.w; sx += 124) {

        c.beginPath();
        c.moveTo(sx, sy + 12);
        c.quadraticCurveTo(sx + 9, sy + 2, sx + 16, sy - 6);
        c.moveTo(sx + 6, sy + 7);
        c.quadraticCurveTo(sx + 2, sy - 3, sx - 4, sy - 5);

    }

    var mg = c.createLinearGradient(0, 16, 0, 42);
    mg.addColorStop(0, '#fbf3e5');
    mg.addColorStop(1, '#e8d6bc');
    c.fillStyle = mg;

  }

    c.save();
    var frameWood = c.createLinearGradient(x - 14, y - 14, x + w + 14, y + h + 14);

    frameWood.addColorStop(1, '#8f6438');

    c.fill();
    c.strokeStyle = 'rgba(85, 55, 30, 0.32)';

    c.stroke();

    c.fillStyle = '#f6e8d2';
    roundRect(c, x - 6, y - 6, w + 12, h + 12, 10);

    var sky = c.createLinearGradient(0, iy, 0, iy + ih);

    c.fillRect(ix, iy, iw, ih);

    var sun = c.createRadialGradient(ix + iw * 0.78, iy + 80, 6, ix + iw * 0.78, iy + 80, 92);
    sun.addColorStop(0, 'rgba(255, 246, 205, 0.95)');

      var cx = ix + iw * cloudSpots[ci][0];

    c.lineTo(ix, iy + ih * 0.74);
    c.quadraticCurveTo(ix + iw * 0.22, iy + ih * 0.6, ix + iw * 0.48, iy + ih * 0.7);

  function drawCurtain(c, x, left) {

    g.addColorStop(1, '#bd9a5d');

    c.beginPath();
    c.moveTo(0, 90);
    c.lineTo(82 * dir, 90);
    c.bezierCurveTo(76 * dir, 240, 96 * dir, 390, 72 * dir, 598);
    c.bezierCurveTo(48 * dir, 610, 20 * dir, 606, 0, 598);

    c.fill();

  function drawClock(c, x, y, r) {
    softShadow(c, x + 5, y + r + 8, r * 0.9, 10, 0.14);

    c.fillStyle = '#b48353';
    c.beginPath();
    c.arc(x, y, r, 0, TAU);
    c.fill();

    var face = c.createRadialGradient(x - r * 0.25, y - r * 0.3, 2, x, y, r);
    face.addColorStop(0, '#fffaf0');
    face.addColorStop(1, '#f2e4ce');
    c.fillStyle = face;
    c.beginPath();
    c.arc(x, y, r - 7, 0, TAU);
    c.fill();

    c.strokeStyle = 'rgba(95, 66, 42, 0.5)';
    c.lineWidth = 2;
    for (var i = 0; i < 12; i++) {
      var a = (i / 12) * TAU;
      var r1 = r - (i % 3 === 0 ? 18 : 14);
      var r2 = r - 9;
      c.beginPath();
      c.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
      c.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2);
      c.stroke();
    }

    c.strokeStyle = '#5c4430';
    c.lineWidth = 3;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + Math.cos(-0.5) * r * 0.42, y + Math.sin(-0.5) * r * 0.42);
    c.stroke();
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + Math.cos(1.2) * r * 0.6, y + Math.sin(1.2) * r * 0.6);
    c.stroke();
    c.fillStyle = '#5c4430';
    c.beginPath();
    c.arc(x, y, 3, 0, TAU);
    c.fill();
  }

  function drawFloor(c, rng) {
    var g = c.createLinearGradient(0, WORLD.floor, 0, WORLD.h);
    g.addColorStop(0, '#cb9c6a');
    g.addColorStop(0.55, '#bd8b58');
    g.addColorStop(1, '#a97848');
    c.fillStyle = g;
    c.fillRect(0, WORLD.floor, WORLD.w, WORLD.h - WORLD.floor);

    var seams = [WORLD.floor + 2, 782, 826, 876];
    c.strokeStyle = 'rgba(104, 68, 38, 0.28)';
    c.lineWidth = 2;
    for (var s = 0; s < seams.length; s++) {
      c.beginPath();
      c.moveTo(0, seams[s]);
      c.lineTo(WORLD.w, seams[s]);
      c.stroke();
    }

    var joints = [
      { y1: WORLD.floor, y2: 782, off: 0 },
      { y1: 782, y2: 826, off: 130 },
      { y1: 826, y2: 876, off: 64 },
      { y1: 876, y2: WORLD.h + 10, off: 210 }
    ];
    c.strokeStyle = 'rgba(104, 68, 38, 0.22)';
    c.lineWidth = 1.4;
    for (var j = 0; j < joints.length; j++) {
      var seg = joints[j];
      for (var jx = joints[j].off; jx < WORLD.w; jx += 320) {
        c.beginPath();
        c.moveTo(jx, seg.y1);
        c.lineTo(jx, seg.y2);
        c.stroke();
      }
    }

    c.strokeStyle = 'rgba(133, 92, 54, 0.16)';
    c.lineWidth = 1;
    for (var i = 0; i < 70; i++) {
      var gx = rng() * WORLD.w;
      var gy = WORLD.floor + 8 + rng() * (WORLD.h - WORLD.floor - 10);
      c.beginPath();
      c.moveTo(gx, gy);
      c.bezierCurveTo(gx + 18, gy - 2, gx + 28, gy + 2, gx + 54, gy);
      c.stroke();
    }

    g = c.createLinearGradient(0, WORLD.floor, 0, WORLD.floor + 28);
    g.addColorStop(0, 'rgba(68, 43, 24, 0.22)');
    g.addColorStop(1, 'rgba(68, 43, 24, 0)');
    c.fillStyle = g;
    c.fillRect(0, WORLD.floor, WORLD.w, 28);

    var pool = c.createRadialGradient(700, 802, 20, 700, 802, 360);
    pool.addColorStop(0, 'rgba(255, 240, 198, 0.30)');
    pool.addColorStop(0.6, 'rgba(255, 240, 198, 0.11)');
    pool.addColorStop(1, 'rgba(255, 240, 198, 0)');
    c.fillStyle = pool;
    c.fillRect(300, 730, 800, 170);
  }

    c.moveTo(4, 0);
    c.quadraticCurveTo(len * 0.5, -wid * 0.12, len * 0.92, 0);
    c.stroke();
    c.restore();

  function drawBooks(c, x, baseY, width, rng) {
    var palette = ['#b96b4e', '#7d9271', '#c9a15a', '#6f7f95', '#d9c3a3', '#8b5e4a', '#a8845f', '#5f7b75', '#b98a5a'];
    var cx = x;
    while (cx < x + width - 7) {
      var bw = 6 + rng() * 11;
      var bh = 18 + rng() * 34;
      if (cx + bw > x + width) break;
      var col = palette[(rng() * palette.length) | 0];
      c.fillStyle = col;
      roundRect(c, cx, baseY - bh, bw, bh, 1.5);
      c.fill();
      c.fillStyle = 'rgba(255, 250, 236, 0.22)';
      c.fillRect(cx + 1.5, baseY - bh + 3, 1.5, bh - 6);
      c.fillStyle = 'rgba(45, 29, 16, 0.22)';
      c.fillRect(cx, baseY - 2, bw, 2);
      cx += bw + 2 + rng() * 2;
    }
  }

  var BOWL_SLOTS = [-68, -34, 34, 68];

  function isDark(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    var r = (n >> 16) & 255;
    var g = (n >> 8) & 255;
    var b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) < 128;
  }

  function bezierPoint(p0, p1, p2, p3, t) {
    var mt = 1 - t;
    return {
      x: mt * mt * mt * p0.x + 3 * mt * mt * t * p1.x + 3 * mt * t * t * p2.x + t * t * t * p3.x,
      y: mt * mt * mt * p0.y + 3 * mt * mt * t * p1.y + 3 * mt * t * t * p2.y + t * t * t * p3.y
    };
  }

  function bezierTangent(p0, p1, p2, p3, t) {
    var mt = 1 - t;
    return {
      x: 3 * mt * mt * (p1.x - p0.x) + 6 * mt * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x),
      y: 3 * mt * mt * (p1.y - p0.y) + 6 * mt * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y)
    };
  }

  function Cat(cfg, x, surfaceId) {
    var B = BREEDS[cfg.breed] || BREEDS.domestic;
    this.id = state.nextCatId++;
    this.name = cfg.name;
    this.breed = cfg.breed;
    this.coat = cfg.coat;
    this.eyes = cfg.eyes;
    this.persona = cfg.persona;

    this.scale = B.scale * rand(0.96, 1.04);
    this.surface = platformById(surfaceId || 'floor');
    this.x = clamp(x, this.surface.x1 + 30, this.surface.x2 - 30);
    this.y = this.surface.y;
    this.dir = Math.random() < 0.5 ? -1 : 1;

    this.mode = 'idle';
    this.idlePose = 'sit';
    this.stateT = rand(1.5, 3.5);
    this.sit = 1;
    this.loaf = 0;
    this.walkPhase = rand(0, TAU);
    this.tailPhase = rand(0, TAU);
    this.blinkT = rand(1, 4);
    this.blink = 0;
    this.earT = rand(2, 5);
    this.earTwitch = 0;
    this.jump = null;
    this.goal = null;
    this.slot = null;
    this.waitT = 0;
    this.eatT = 0;
    this.eatPhase = 0;
    this.consumed = false;
    this.petT = 0;
    this.petHeartT = 0;
    this.tagT = 0;
    this.landSquash = 0;
    this.sleepy = false;
    this.zzzT = 0;
    this.petQueued = false;
    this.petQueuedX = 0;
    this.targetX = this.x;
    this.hovered = false;

    var speedFactor = this.persona === 'playful' ? 1.2 : this.persona === 'lazy' ? 0.82 : 0.95;
    this.speed = rand(56, 72) * speedFactor;
  }

  Cat.prototype.update = function (dt) {
    var k;
    this.tailPhase += dt * (1.7 + (this.mode === 'walk' ? 3.2 : 0));
    this.blinkT -= dt;
    if (this.blinkT <= 0) {
      this.blink = 1;
      this.blinkT = rand(2.4, 6.2);
    }
    this.blink = Math.max(0, this.blink - dt * 4.5);

    this.earT -= dt;
    if (this.earT <= 0) {
      this.earTwitch = 1;
      this.earT = rand(3, 7);
    }
    this.earTwitch = Math.max(0, this.earTwitch - dt * 6);

    if (this.tagT > 0) this.tagT = Math.max(0, this.tagT - dt);
    if (this.landSquash > 0) this.landSquash = Math.max(0, this.landSquash - dt * 3.2);

    if (this.mode === 'jump') this.updateJump(dt);
    else if (this.mode === 'walk') this.updateWalk(dt);
    else if (this.mode === 'eat') this.updateEat(dt);
    else if (this.mode === 'pet') this.updatePet(dt);
    else this.updateIdle(dt);

    var targetSit = 0;
    var targetLoaf = 0;
    if (this.mode === 'idle') {
      targetSit = this.idlePose === 'stand' ? 0 : 1;
      targetLoaf = this.idlePose === 'loaf' ? 1 : 0;
      if (this.idlePose === 'loaf') targetSit = 0;
    } else if (this.mode === 'eat' || this.mode === 'pet') {
      targetSit = 1;
    }

    k = 1 - Math.exp(-8 * dt);
    this.sit += (targetSit - this.sit) * k;
    this.loaf += (targetLoaf - this.loaf) * k;

    if (this.mode === 'jump') {
      this.sit = Math.max(0, this.sit - dt * 7);
      this.loaf = 0;
    }
  };

  Cat.prototype.updateIdle = function (dt) {
    if (this.goal === 'bowl') {
      if (state.bowlFood > 0) {
        if (this.waitT > 0) this.waitT -= dt;
        else this.seekBowl();
        return;
      }
      this.goal = null;
      this.slot = null;
    }

    this.stateT -= dt;
    if (this.stateT <= 0) {
      this.chooseAction();
      return;
    }

    if (this.sleepy) {
      this.zzzT -= dt;
      if (this.zzzT <= 0) {
        addZ(this);
        this.zzzT = rand(1.6, 2.8);
      }
    }
  };

  Cat.prototype.chooseAction = function () {
    var playful = this.persona === 'playful';
    var lazy = this.persona === 'lazy';
    var walkP = playful ? 0.4 : lazy ? 0.28 : 0.43;
    var jumpP = playful ? 0.42 : lazy ? 0.18 : 0.3;
    var r = Math.random();

    if (r < walkP) this.walkSomewhere();
    else if (r < walkP + jumpP) this.jumpSomewhere();
    else this.rest();
  };

  Cat.prototype.walkSomewhere = function () {
    var b = this.surface;
    var lo = b.x1 + 26;
    var hi = b.x2 - 26;
    if (hi < lo) lo = hi = (b.x1 + b.x2) / 2;

    var tx = clamp(this.x + rand(-230, 230), lo, hi);
    if (Math.abs(tx - this.x) < 46) {
      var mid = (lo + hi) / 2;
      tx = clamp(this.x < mid ? this.x + 150 : this.x - 150, lo, hi);
    }

    this.mode = 'walk';
    this.targetX = tx;
    this.walkPhase = 0;
    this.dir = tx > this.x ? 1 : -1;
    this.sleepy = false;
    this.goal = null;
    this.slot = null;
  };

  Cat.prototype.jumpSomewhere = function () {
    var opts = [];
    for (var i = 0; i < platforms.length; i++) {
      var pl = platforms[i];
      if (pl === this.surface) continue;
      if (pl.y < this.surface.y - 168) continue;
      var lo = pl.x1 + 26;
      var hi = pl.x2 - 26;
      if (hi < lo) lo = hi = (pl.x1 + pl.x2) / 2;
      var tx = clamp(this.x + rand(-190, 190), lo, hi);
      if (Math.abs(tx - this.x) > 326) continue;
      opts.push({ pl: pl, x: tx, d: Math.abs(tx - this.x) + Math.abs(pl.y - this.surface.y) * 0.4 });
    }

    if (!opts.length) {
      this.walkSomewhere();
      return;
    }

    opts.sort(function (a, b) { return a.d - b.d; });
    var choice = opts[Math.floor(Math.random() * Math.min(opts.length, 4))];
    this.startJump(choice.pl, choice.x);
  };

  Cat.prototype.startJump = function (target, tx) {
    var lo = target.x1 + 24;
    var hi = target.x2 - 24;
    if (hi < lo) lo = hi = (target.x1 + target.x2) / 2;
    tx = clamp(tx, lo, hi);

    var dist = Math.sqrt((tx - this.x) * (tx - this.x) + (target.y - this.y) * (target.y - this.y));
    var peak = 38 + Math.max(0, this.y - target.y) * 0.55 + Math.abs(tx - this.x) * 0.06;

    this.jump = {
      t: 0,
      dur: clamp(0.4 + dist / 900, 0.42, 0.9),
      x0: this.x,
      y0: this.y,
      x1: tx,
      y1: target.y,
      peak: peak,
      target: target
    };
    this.mode = 'jump';
    this.dir = tx > this.x ? 1 : -1;
    this.sleepy = false;
    this.tagT = 0;
  };

  Cat.prototype.updateJump = function (dt) {
    var j = this.jump;
    j.t += dt;
    var p = Math.min(1, j.t / j.dur);
    this.x = lerp(j.x0, j.x1, p);
    this.y = lerp(j.y0, j.y1, p) - Math.sin(p * Math.PI) * j.peak;
    this.walkPhase += dt * 5;

    if (p >= 1) {
      this.x = j.x1;
      this.y = j.y1;
      this.surface = j.target;
      this.jump = null;
      this.mode = 'idle';
      this.idlePose = 'sit';
      this.stateT = rand(0.8, 1.7);
      this.landSquash = 1;
      addDust(this.x, this.y, 5);
      if (this.petQueued) {
        this.petQueued = false;
        this.pet(this.petQueuedX);
      }
    }
  };

  Cat.prototype.updateWalk = function (dt) {
    var b = this.surface;
    var dx = this.targetX - this.x;
    if (Math.abs(dx) < 3) {
      this.x = this.targetX;
      this.mode = 'idle';
      if (this.goal === 'bowl' && b.id === 'floor' && Math.abs(this.x - BOWL_X) < 184 && state.bowlFood > 0) {
        this.startEat();
      } else {
        this.idlePose = 'sit';
        this.stateT = rand(1.4, 3.8);
      }
      return;
    }

    this.dir = dx > 0 ? 1 : -1;
    var sp = this.speed * (this.goal === 'bowl' ? 1.35 : 1);
    this.x += this.dir * sp * dt;
    this.walkPhase += dt * (5.2 + sp * 0.085);

    var lo = b.x1 + 24;
    var hi = b.x2 - 24;
    if (hi < lo) lo = hi = (b.x1 + b.x2) / 2;
    this.x = clamp(this.x, lo, hi);
  };

  Cat.prototype.pickSlot = function () {
    var used = {};
    for (var i = 0; i < state.cats.length; i++) {
      var other = state.cats[i];
      if (other !== this && other.slot !== null) used[other.slot] = true;
    }
    var free = [];
    for (var s = 0; s < BOWL_SLOTS.length; s++) {
      if (!used[BOWL_SLOTS[s]]) free.push(BOWL_SLOTS[s]);
    }
    if (!free.length) return null;
    return pick(free);
  };

  Cat.prototype.seekBowl = function () {
    if (state.bowlFood <= 0) {
      this.goal = null;
      this.slot = null;
      this.rest();
      return;
    }

    if (this.surface.id !== 'floor') {
      var jumpX = clamp(this.x + rand(-100, 100), 90, WORLD.w - 90);
      this.startJump(platformById('floor'), jumpX);
      return;
    }

    if (this.slot === null) {
      var slot = this.pickSlot();
      if (slot === null) {
        var waitX = BOWL_X + (this.x < BOWL_X ? -142 : 142);
        var dxw = waitX - this.x;
        if (Math.abs(dxw) < 8) {
          this.mode = 'idle';
          this.idlePose = 'sit';
          this.stateT = 1;
          this.waitT = 0.65;
          this.sleepy = false;
        } else {
          this.mode = 'walk';
          this.targetX = waitX;
          this.walkPhase = 0;
          this.dir = dxw > 0 ? 1 : -1;
        }
        return;
      }
      this.slot = slot;
    }

    var target = BOWL_X + this.slot;
    if (Math.abs(this.x - target) < 8) {
      this.startEat();
    } else {
      this.mode = 'walk';
      this.targetX = target;
      this.walkPhase = 0;
      this.dir = target > this.x ? 1 : -1;
      this.sleepy = false;
    }
  };

  Cat.prototype.startEat = function () {
    if (state.bowlFood <= 0) {
      this.goal = null;
      this.slot = null;
      this.rest();
      return;
    }
    if (this.slot === null) {
      var slot = this.pickSlot();
      if (slot === null) {
        this.waitT = 0.7;
        this.mode = 'idle';
        this.idlePose = 'sit';
        return;
      }
      this.slot = slot;
    }

    this.x = BOWL_X + this.slot;
    this.dir = this.x < BOWL_X ? 1 : -1;
    this.mode = 'eat';
    this.eatT = 0;
    this.eatPhase = 0;
    this.consumed = false;
    this.sleepy = false;
    this.tagT = Math.max(this.tagT, 1.4);
    this.waitT = 0;
  };

  Cat.prototype.updateEat = function (dt) {
    this.eatT += dt;
    this.eatPhase += dt * 3.6;

    if (!this.consumed && this.eatT > 0.75) {
      this.consumed = true;
      if (state.bowlFood > 0) {
        state.bowlFood = Math.max(0, state.bowlFood - 1);
        addCrumbs(BOWL_X + rand(-22, 22), WORLD.floor - 26, 4);
      }
    }

    if (this.eatT > 2.5) {
      this.mode = 'idle';
      this.idlePose = 'sit';
      this.stateT = rand(1.2, 2.6);
      this.goal = null;
      this.slot = null;
      this.tagT = Math.max(this.tagT, 1);
    }
  };

  Cat.prototype.pet = function (pointerWorldX) {
    if (this.mode === 'jump') {
      this.petQueued = true;
      this.petQueuedX = pointerWorldX;
      this.tagT = 3;
      return;
    }
    this.releaseSlot();
    this.mode = 'pet';
    this.petT = 2.9;
    this.petHeartT = 0;
    this.idlePose = 'sit';
    this.sleepy = false;
    this.tagT = 4;
    this.dir = pointerWorldX < this.x ? -1 : 1;
    this.sit = Math.min(1, this.sit + 0.25);

    addHearts(this, 5);
    addText(this.x + this.dir * 26, this.y - 82 * this.scale, pick(['мур-р', 'мурр', 'пррр']), 'rgba(96, 58, 44, 0.85)', 15);
  };

  Cat.prototype.updatePet = function (dt) {
    this.petT -= dt;
    this.petHeartT -= dt;
    if (this.petHeartT <= 0 && this.petT > 0.5) {
      addHearts(this, 1);
      this.petHeartT = rand(0.55, 0.95);
    }
    if (this.petT <= 0) {
      this.mode = 'idle';
      this.idlePose = 'sit';
      this.stateT = rand(1.2, 2.6);
      this.tagT = Math.max(this.tagT, 1);
    }
  };

  Cat.prototype.releaseSlot = function () {
    this.slot = null;
  };

  Cat.prototype.rest = function () {
    this.mode = 'idle';
    var r = Math.random();
    if (this.persona === 'lazy') {
      this.idlePose = r < 0.62 ? 'loaf' : r < 0.9 ? 'sit' : 'stand';
    } else if (this.persona === 'playful') {
      this.idlePose = r < 0.48 ? 'sit' : r < 0.78 ? 'stand' : 'loaf';
    } else {
      this.idlePose = r < 0.5 ? 'sit' : r < 0.82 ? 'loaf' : 'stand';
    }
    this.stateT = rand(1.8, 4.2) * (this.persona === 'lazy' ? 1.5 : 1);
    this.sleepy = this.idlePose === 'loaf' && Math.random() < (this.persona === 'lazy' ? 0.75 : 0.4);
    this.zzzT = rand(0.9, 1.8);
  };

  /* ------------------------- cat rendering ------------------------- */

  function catPose(cat, B) {
    var s = cat.sit;
    var l = cat.loaf;
    var p = {
      cx: mix(mix(0, -2, s), 0, l),
      cy: mix(mix(-40, -31, s), -19, l),
      rx: mix(mix(27, 24, s), 38, l) * B.build,
      ry: mix(mix(20, 31, s), 18, l) * B.build,
      hx: mix(mix(27, 11, s), 27, l),
      hy: mix(mix(-62, -72, s), -37, l),
      hr: mix(mix(19, 18, s), 17, l) * (0.96 + B.build * 0.04),
      headTilt: 0
    };

    if (cat.mode === 'walk') {
      p.cy += Math.sin(cat.walkPhase * 2) * 1.2;
      p.hy += Math.sin(cat.walkPhase * 2 + 0.6) * 1.3;
    }

    if (cat.mode === 'jump') {
      p.cx = 0;
      p.cy = -42;
      p.rx = 37 * B.build;
      p.ry = 15 * B.build;
      p.hx = 34;
      p.hy = -58;
      p.hr = 17 * (0.96 + B.build * 0.04);
    }

    if (cat.mode === 'eat') {
      p.hx += 20;
      p.hy += 33 - Math.sin(cat.eatPhase) * 2.5;
      p.headTilt = 0.38;
    } else if (cat.mode === 'pet') {
      p.hx += 3;
      p.hy += 3;
      p.headTilt = -0.09 + Math.sin(state.time * 2.2) * 0.025;
    } else if (cat.sleepy && l > 0.6) {
      p.hy += 3;
      p.headTilt = 0.15;
    }

    return p;
  }

  function drawCat(c, cat, t) {
    var B = BREEDS[cat.breed] || BREEDS.domestic;
    var coat = COATS[cat.coat] || COATS.ginger;
    var p = catPose(cat, B);

    c.save();
    c.translate(cat.x, cat.y);
    c.scale(cat.dir * cat.scale, cat.scale);

    if (cat.landSquash > 0) {
      c.scale(1 + 0.06 * cat.landSquash, 1 - 0.08 * cat.landSquash);
    }

    if (cat.mode === 'jump' && cat.jump) {
      var jp = cat.jump.t / cat.jump.dur;
      c.rotate((jp - 0.5) * 0.38);
    }

    drawTail(c, cat, B, coat, p);

    var standA = clamp(1 - p.sit - p.loaf, 0, 1);
    if (cat.mode !== 'jump') drawStandLegs(c, cat, B, coat, p, standA, true);

    drawBody(c, cat, B, coat, p);

    if (cat.mode !== 'jump') {
      drawStandLegs(c, cat, B, coat, p, standA, false);
      drawSittingLegs(c, cat, B, coat, p);
      drawLoafPaws(c, cat, B, coat, p);
    } else {
      drawJumpLegs(c, cat, B, coat, p);
    }

    drawChestFluff(c, cat, B, coat, p);
    drawHead(c, cat, B, coat, p);

    c.restore();
  }

  function drawTail(c, cat, B, coat, p) {
    var bx = p.cx - p.rx * 0.9;
    var by = p.cy + p.ry * 0.3;
    var wag = Math.sin(cat.tailPhase);

    var x1, y1, x2, y2, x3, y3;
    if (cat.mode === 'jump') {
      x1 = bx - 18;
      y1 = by - 6;
      x2 = bx - 40;
      y2 = by - 22 + wag * 2;
      x3 = bx - 52;
      y3 = by - 8 + wag * 3;
    } else if (cat.loaf > 0.5) {
      x1 = bx - 16;
      y1 = by + 3;
      x2 = bx + 6;
      y2 = by + p.ry * 0.95;
      x3 = bx + p.rx * 0.95 + wag * 3;
      y3 = by + 5;
    } else if (cat.sit > 0.5) {
      x1 = bx - 24;
      y1 = by + 2;
      x2 = bx + 8;
      y2 = 3;
      x3 = bx + p.rx * 1.15 + wag * 4;
      y3 = -2;
    } else {
      x1 = bx - 14;

    c.moveTo(hr * 0.82, hr * 0.28);
    c.quadraticCurveTo(hr * 0.88, hr * 0.4, hr * 1.02, hr * 0.37);
    c.stroke();

    var whiskerColor = isDark(coat.base) ? 'rgba(255, 250, 238, 0.45)' : 'rgba(80, 56, 38, 0.32)';
    c.strokeStyle = whiskerColor;
    c.lineWidth = 0.9;
    for (var w = -1; w <= 1; w++) {
      c.beginPath();
      c.moveTo(hr * 0.66, hr * 0.32);
      c.quadraticCurveTo(hr * 0.96, hr * 0.27 + w * hr * 0.1, hr * 1.38, hr * 0.19 + w * hr * 0.17);
      c.stroke();
      c.beginPath();
      c.moveTo(hr * 0.5, hr * 0.34);
      c.quadraticCurveTo(hr * 0.24, hr * 0.3 + w * hr * 0.08, -hr * 0.16, hr * 0.28 + w * hr * 0.15);
      c.stroke();
    }

    if (B.ear === 'big') {
      c.strokeStyle = 'rgba(92, 65, 47, 0.18)';
      c.lineWidth = 1.1;
      c.beginPath();
      c.moveTo(-hr * 0.55, -hr * 0.42);
      c.quadraticCurveTo(-hr * 0.2, -hr * 0.55, hr * 0.15, -hr * 0.5);
      c.moveTo(-hr * 0.4, -hr * 0.25);
      c.quadraticCurveTo(-hr * 0.1, -hr * 0.35, hr * 0.2, -hr * 0.3);
      c.stroke();
    }

    c.restore();
  }

  function drawEye(c, cat, x, y, r, open, color, tilt) {
    if (open <= 0.18) {
      c.strokeStyle = 'rgba(55, 38, 28, 0.72)';
      c.lineWidth = 1.8;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(x - r * 0.9, y + r * 0.1);
      c.quadraticCurveTo(x, y - r * 0.72, x + r * 0.9, y + r * 0.1);
      c.stroke();
      return;
    }

    c.save();
    c.translate(x, y);
    c.rotate(tilt);
    c.scale(1, Math.max(0.2, open));

    c.fillStyle = '#2b211c';
    c.beginPath();
    c.ellipse(0, 0, r * 1.02, r * 0.86, 0, 0, TAU);
    c.fill();

    c.fillStyle = color;
    c.beginPath();
    c.ellipse(0, 0, r * 0.84, r * 0.74, 0, 0, TAU);
    c.fill();

    c.fillStyle = '#221914';
    c.beginPath();
    c.ellipse(0, 0, r * 0.25, r * 0.6, 0, 0, TAU);
    c.fill();

    c.fillStyle = 'rgba(255, 255, 255, 0.85)';
    c.beginPath();
    c.arc(-r * 0.3, -r * 0.28, r * 0.19, 0, TAU);
    c.fill();

    c.restore();
  }

  function drawCatShadow(c, cat) {
    var air = Math.max(0, cat.surface.y - cat.y);
    var k = clamp(1 - air / 190, 0.25, 1);
    c.save();
    c.globalAlpha = 0.17 * k;
    c.fillStyle = '#3a2418';
    c.beginPath();
    c.ellipse(cat.x, cat.surface.y + 3, 38 * cat.scale * k, 7.5 * cat.scale * k, 0, 0, TAU);
    c.fill();
    c.restore();
  }

  function drawNameTag(c, cat) {
    if (cat.mode === 'pet') return;
    if (!(cat.hovered || cat.tagT > 0)) return;
    var tagY = cat.y - (cat.loaf > 0.5 ? 64 : 104) * cat.scale;
    var alpha = cat.hovered ? 1 : clamp(cat.tagT / 0.5, 0, 1);

    c.save();
    c.globalAlpha = alpha;
    c.font = '600 12px ui-sans-serif, system-ui, "Segoe UI", sans-serif';
    var w = Math.min(150, c.measureText(cat.name).width + 18);
    var h = 23;

    c.fillStyle = 'rgba(74, 54, 40, 0.18)';
    roundRect(c, cat.x - w / 2 + 1, tagY - h / 2 + 2, w, h, 11);
    c.fill();

    c.fillStyle = '#fff8ec';
    roundRect(c, cat.x - w / 2, tagY - h / 2, w, h, 11);
    c.fill();

    c.fillStyle = '#4a3628';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(cat.name, cat.x, tagY + 0.5, w - 14);

    c.fillStyle = '#fff8ec';
    c.beginPath();
    c.moveTo(cat.x - 4, tagY + h / 2 - 1);
    c.lineTo(cat.x + 4, tagY + h / 2 - 1);
    c.lineTo(cat.x, tagY + h / 2 + 5);
    c.closePath();
    c.fill();

    c.restore();
  }

  /* ------------------------- particles ------------------------- */

  function addHearts(cat, n) {
    for (var i = 0; i < n; i++) {
      state.particles.push({
        type: 'heart',
        x: cat.x + rand(-24, 24),
        y: cat.y - 72 * cat.scale + rand(-12, 4),
        vx: rand(-10, 10),
        vy: rand(-46, -24),
        age: 0,
        dur: rand(1.2, 2),
        size: rand(6, 10),
        rot: rand(-0.35, 0.35),
        phase: rand(0, TAU)
      });
    }
  }

  function addText(x, y, text, color, size) {
    state.particles.push({
      type: 'text',
      text: text,
      x: x,
      y: y,
      vx: rand(-4, 4),
      vy: -16,
      age: 0,
      dur: 1.5,
      color: color,
      size: size
    });
  }

  function addDust(x, y, n) {
    for (var i = 0; i < n; i++) {
      state.particles.push({
        type: 'dust',
        x: x + rand(-18, 18),
        y: y + rand(-4, 2),
        vx: rand(-18, 18),
        vy: rand(-22, -6),
        age: 0,
        dur: rand(0.5, 0.85),
        size: rand(3, 7),
        rot: 0
      });
    }
  }

  function addCrumbs(x, y, n) {
    for (var i = 0; i < n; i++) {
      state.particles.push({
        type: 'crumb',
        x: x + rand(-8, 8),
        y: y + rand(-4, 2),
        vx: rand(-22, 22),
        vy: rand(-40, -14),
        age: 0,
        dur: rand(0.45, 0.8),
        size: rand(1.2, 2.4),
        rot: 0
      });
    }
  }

  function addZ(cat) {
    state.particles.push({
      type: 'z',
      text: 'z',
      x: cat.x + 20 * cat.scale,
      y: cat.y - 48 * cat.scale,
      vx: rand(2, 7),
      vy: -13,
      age: 0,
      dur: 1.7,
      size: rand(9, 12)
    });
  }

  function updateParticles(dt) {
    for (var i = 0; i < state.particles.length; i++) {
      var p = state.particles[i];
      p.age += dt;
      if (p.type === 'crumb') {
        p.vy += 180 * dt;
      } else if (p.type === 'dust') {
        p.vx *= Math.pow(0.15, dt);
      } else if (p.type === 'heart') {
        p.x += Math.sin(p.age * 5 + p.phase) * 9 * dt;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    state.particles = state.particles.filter(function (p) { return p.age < p.dur; });
  }

  function drawParticles(c) {
    for (var i = 0; i < state.particles.length; i++) {
      var p = state.particles[i];
      var k = p.age / p.dur;
      var alpha = 1 - k;

      if (p.type === 'heart') {
        c.save();
        c.globalAlpha = alpha * 0.9;
        c.translate(p.x, p.y);
        c.rotate(p.rot + Math.sin(p.age * 4 + p.phase) * 0.1);
        c.fillStyle = '#d8556f';
        c.beginPath();
        c.moveTo(0, p.size * 0.4);
        c.bezierCurveTo(-p.size * 0.95, -p.size * 0.4, -p.size * 0.45, -p.size * 1.15, 0, -p.size * 0.5);
        c.bezierCurveTo(p.size * 0.45, -p.size * 1.15, p.size * 0.95, -p.size * 0.4, 0, p.size * 0.4);
        c.fill();
        c.strokeStyle = 'rgba(255, 245, 240, 0.5)';
        c.lineWidth = 0.8;
        c.stroke();
        c.restore();
      } else if (p.type === 'text') {
        c.save();
        c.globalAlpha = alpha * 0.9;
        c.fillStyle = p.color;
        c.font = 'italic ' + p.size + 'px "Palatino Linotype", Palatino, Georgia, serif';
        c.textAlign = 'center';
        c.fillText(p.text, p.x, p.y);
        c.restore();
      } else if (p.type === 'z') {
        c.save();
        c.globalAlpha = alpha * 0.65;
        c.fillStyle = 'rgba(95, 72, 52, 0.8)';
        c.font = '600 ' + p.size + 'px "Palatino Linotype", Georgia, serif';
        c.textAlign = 'center';
        c.fillText(p.text, p.x, p.y);
        c.restore();
      } else if (p.type === 'dust') {
        c.save();
        c.globalAlpha = alpha * 0.25;
        c.fillStyle = '#b58c60';
        c.beginPath();
        c.arc(p.x, p.y, p.size * (1 + k * 1.8), 0, TAU);
        c.fill();
        c.restore();
      } else if (p.type === 'crumb') {
        c.save();
        c.globalAlpha = alpha;
        c.fillStyle = '#a87545';
        c.beginPath();
        c.arc(p.x, p.y, p.size, 0, TAU);
        c.fill();
        c.restore();
      }
    }
  }

  /* ------------------------- food bowl ------------------------- */

  function drawBowl(c) {
    var bx = BOWL_X;
    var by = WORLD.floor;

    c.save();
    c.translate(bx, by + 3);
    c.scale(1, 0.3);
    c.fillStyle = 'rgba(118, 79, 48, 0.16)';
    c.beginPath();
    c.arc(0, 0, 74, 0, TAU);
    c.fill();
    c.fillStyle = '#d9bd97';
    c.beginPath();
    c.arc(0, 0, 68, 0, TAU);
    c.fill();
    c.strokeStyle = '#c3a37a';
    c.lineWidth = 3;
    c.beginPath();
    c.arc(0, 0, 57, 0, TAU);
    c.stroke();
    c.restore();

    drawWaterBowl(c, bx + 92, by);

    c.save();
    c.translate(bx, by);

    var body = c.createLinearGradient(0, -36, 0, 0);
    body.addColorStop(0, '#d18460');
    body.addColorStop(0.45, '#bd6c4c');
    body.addColorStop(1, '#9d4e35');
    c.fillStyle = body;
    c.beginPath();
    c.moveTo(-38, -33);
    c.quadraticCurveTo(-37, -12, -24, -5);
    c.quadraticCurveTo(0, 2, 24, -5);
    c.quadraticCurveTo(37, -12, 38, -33);
    c.closePath();
    c.fill();

    var rim = c.createLinearGradient(0, -42, 0, -24);
    rim.addColorStop(0, '#e29a76');
    rim.addColorStop(1, '#b96143');
    c.fillStyle = rim;
    c.beginPath();
    c.ellipse(0, -33, 39, 9, 0, 0, TAU);
    c.fill();

    c.fillStyle = '#7d3f2c';
    c.beginPath();
    c.ellipse(0, -33, 31, 6.2, 0, 0, TAU);
    c.fill();

    if (state.bowlFood > 0) {
      var pieces = Math.round(state.bowlFood * 5);
      for (var i = 0; i < pieces; i++) {
        var a = (i * 2.399) % TAU;
        var rr = 5 + (i % 4) * 5;
        var px = Math.cos(a) * rr;
        var py = -34 + Math.sin(a) * rr * 0.18;
        c.fillStyle = i % 3 === 0 ? '#8a5a34' : i % 3 === 1 ? '#b27b48' : '#6f8a57';
        c.beginPath();
        c.ellipse(px, py, 2.4, 1.7, a, 0, TAU);
        c.fill();
      }
    }

    c.fillStyle = 'rgba(255, 244, 226, 0.7)';
    c.beginPath();
    c.ellipse(-14, -20, 3, 2.2, -0.3, 0, TAU);
    c.ellipse(0, -17, 2.4, 1.8, 0, 0, TAU);
    c.ellipse(12, -21, 2.6, 1.9, 0.2, 0, TAU);
    c.fill();
    c.beginPath();
    c.ellipse(0, -24, 9, 6, 0, 0, TAU);
    c.fill();

    c.restore();
  }

  function drawWaterBowl(c, x, y) {
    c.save();
    c.translate(x, y);
    c.fillStyle = 'rgba(118, 79, 48, 0.14)';
    c.beginPath();
    c.ellipse(0, 2, 28, 6, 0, 0, TAU);
    c.fill();

    var g = c.createLinearGradient(0, -22, 0, 0);
    g.addColorStop(0, '#dce8e8');
    g.addColorStop(1, '#a9c3c7');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-26, -20);
    c.quadraticCurveTo(-24, -5, -14, -1);
    c.quadraticCurveTo(0, 3, 14, -1);
    c.quadraticCurveTo(24, -5, 26, -20);
    c.closePath();
    c.fill();

    c.fillStyle = 'rgba(121, 178, 196, 0.8)';
    c.beginPath();
    c.ellipse(0, -20, 26, 6, 0, 0, TAU);
    c.fill();
    c.fillStyle = 'rgba(232, 249, 250, 0.7)';
    c.beginPath();
    c.ellipse(-7, -21, 8, 2, -0.2, 0, TAU);
    c.fill();
    c.restore();
  }


  var addCatBtn = document.getElementById('addCatBtn');
  var feedBtn = document.getElementById('feedBtn');
  var soundBtn = document.getElementById('soundBtn');
  var worldAudio = window.WorldAudio ? new window.WorldAudio('room') : null;

  if (worldAudio && soundBtn) worldAudio.bindButton(soundBtn);
  else if (soundBtn) soundBtn.style.display = 'none';

  if (window.TihonProfile) window.TihonProfile.visit('cats');
  var panLeft = document.getElementById('panLeft');
  var panRight = document.getElementById('panRight');
  var catCountEl = document.getElementById('catCount');
  var toastEl = document.getElementById('toast');
  var hintEl = document.getElementById('hint');
  var editorEl = document.getElementById('editorModal');
  var catNameInput = document.getElementById('catName');
  var breedNoteEl = document.getElementById('breedNote');
  var previewCaption = document.getElementById('previewCaption');
  var confirmBtn = document.getElementById('confirmBtn');

  var config = null;
  var lastFocus = null;
  var toastTimer = null;
  var hintTimer = null;
  var previewCat = null;
  var previewDpr = 1;
  var previewW = 0;
  var previewH = 0;
  var previewBlink = 0;
  var previewBlinkT = 2.5;

  state.cameraReady = false;
  state.pointerDown = false;
  state.pointerInside = false;
  state.pointerX = 0;
  state.pointerY = 0;
  state.dragStartY = 0;
  state.hoverCat = null;

  function maxCamera() {
    return Math.max(0, WORLD.w - state.visibleW);
  }

  function clampCamera() {
    var max = maxCamera();
    state.cameraX = clamp(state.cameraX, 0, max);
    state.cameraGoal = clamp(state.cameraGoal, 0, max);
  }

  function setCameraGoal(x) {
    state.cameraGoal = clamp(x, 0, maxCamera());
  }

  function panBy(delta) {
    setCameraGoal(state.cameraGoal + delta);
    hideHint();
  }

  function centerCameraOn(worldX) {
    setCameraGoal(worldX - state.visibleW / 2);
  }

  function updateCamera(dt) {
    if (state.keys.left) state.cameraGoal -= 850 * dt;
    if (state.keys.right) state.cameraGoal += 850 * dt;
    clampCamera();

    var k = 1 - Math.exp(-12 * dt);
    state.cameraX += (state.cameraGoal - state.cameraX) * k;
    if (Math.abs(state.cameraGoal - state.cameraX) < 0.15) state.cameraX = state.cameraGoal;

    updatePanButtons();
  }

  function updatePanButtons() {
    var max = maxCamera();
    var noScroll = max < 1;
    panLeft.classList.toggle('dim', noScroll || state.cameraGoal <= 1);
    panRight.classList.toggle('dim', noScroll || state.cameraGoal >= max - 1);
  }

  function hideHint() {
    if (state.hintHidden || !hintEl) return;
    state.hintHidden = true;
    hintEl.classList.add('hide');
    if (hintTimer) {
      clearTimeout(hintTimer);
      hintTimer = null;
    }
  }

  function showToast(text) {
    if (!toastEl) return;
    toastEl.textContent = text;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
      toastTimer = null;
    }, 3000);
  }

  function updateCounter() {
    catCountEl.textContent = String(state.cats.length);
    var full = state.cats.length >= MAX_CATS;
    addCatBtn.classList.toggle('is-full', full);
    addCatBtn.title = full ? 'В комнате уже 6 котов' : 'Поселить нового кота';
  }

  function randomName() {
    var used = {};
    for (var i = 0; i < state.cats.length; i++) used[state.cats[i].name] = true;
    var pool = CAT_NAMES.filter(function (n) { return !used[n]; });
    return pool.length ? pick(pool) : pick(CAT_NAMES);
  }

  function randomConfig() {
    return {
      name: randomName(),
      breed: pick(Object.keys(BREEDS)),
      coat: pick(Object.keys(COATS)),
      eyes: pick(Object.keys(EYES)),
      persona: pick(Object.keys(PERSONAS))
    };
  }

  /* ------------------------- editor ------------------------- */

  function buildOption(parent, className, value, label, extra) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = className;
    btn.setAttribute('data-value', value);
    btn.setAttribute('aria-pressed', 'false');

    if (className === 'swatch') {
      var dot = document.createElement('span');
      dot.className = 'swatch-dot';
      dot.style.background = extra;
      var lab = document.createElement('span');
      lab.textContent = label;
      btn.appendChild(dot);
      btn.appendChild(lab);
    } else if (className === 'eye-swatch') {
      var eyeDot = document.createElement('span');
      eyeDot.className = 'eye-dot';
      eyeDot.style.background = extra;
      var eyeLab = document.createElement('span');
      eyeLab.textContent = label;
      btn.appendChild(eyeDot);
      btn.appendChild(eyeLab);
    } else {
      btn.textContent = label;
    }

    parent.appendChild(btn);
  }

  function buildEditorOptions() {
    var breedWrap = document.getElementById('breedChips');
    var coatWrap = document.getElementById('coatSwatches');
    var eyeWrap = document.getElementById('eyeChips');
    var personaWrap = document.getElementById('personaChips');

    Object.keys(BREEDS).forEach(function (key) {
      buildOption(breedWrap, 'chip', key, BREEDS[key].name);
    });
    Object.keys(COATS).forEach(function (key) {
      buildOption(coatWrap, 'swatch', key, COATS[key].name, COATS[key].swatch);
    });
    Object.keys(EYES).forEach(function (key) {
      buildOption(eyeWrap, 'eye-swatch', key, EYES[key].name, EYES[key].color);
    });
    Object.keys(PERSONAS).forEach(function (key) {
      buildOption(personaWrap, 'chip', key, PERSONAS[key].name);
    });

    bindGroup('breedChips', 'breed');
    bindGroup('coatSwatches', 'coat');
    bindGroup('eyeChips', 'eyes');
    bindGroup('personaChips', 'persona');
  }

  function bindGroup(id, key) {
    var wrap = document.getElementById(id);
    wrap.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button[data-value]') : null;
      if (!btn) return;
      if (!config) return;
      config[key] = btn.getAttribute('data-value');
      syncEditorSelection();
    });
  }

  function setPressed(id, value) {
    var wrap = document.getElementById(id);
    var nodes = wrap.querySelectorAll('[data-value]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute('aria-pressed', nodes[i].getAttribute('data-value') === value ? 'true' : 'false');
    }
  }

  function syncEditorSelection() {
    if (!config) return;
    setPressed('breedChips', config.breed);
    setPressed('coatSwatches', config.coat);
    setPressed('eyeChips', config.eyes);
    setPressed('personaChips', config.persona);

    breedNoteEl.textContent = BREEDS[config.breed].note;
    previewCaption.textContent = BREEDS[config.breed].name + ' · ' + COATS[config.coat].name + ' · ' + PERSONAS[config.persona].name;

    if (previewCat) {
      previewCat.breed = config.breed;
      previewCat.coat = config.coat;
      previewCat.eyes = config.eyes;
      previewCat.persona = config.persona;
    }
  }

  function openEditor() {
    if (state.cats.length >= MAX_CATS) {
      showToast('В комнате уже живут 6 котов — больше не поместится.');
      return;
    }

    if (worldAudio) worldAudio.sfx('click');

    lastFocus = document.activeElement;
    config = randomConfig();
    catNameInput.value = config.name;
    syncEditorSelection();

    state.editorOpen = true;
    state.hoverCat = null;
    document.body.classList.remove('over-cat');
    editorEl.classList.add('open');
    editorEl.setAttribute('aria-hidden', 'false');
    hideHint();

    requestAnimationFrame(function () {
      resizePreview();
      if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
        catNameInput.focus();
        catNameInput.select();
      }
    });
  }

  function closeEditor() {
    if (!state.editorOpen) return;
    state.editorOpen = false;
    editorEl.classList.remove('open');
    editorEl.setAttribute('aria-hidden', 'true');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  function confirmAdd() {
    if (!config) return;
    if (state.cats.length >= MAX_CATS) {
      showToast('В комнате уже живут 6 котов — больше не поместится.');
      closeEditor();
      return;
    }

    var name = (catNameInput.value || '').trim().slice(0, 18);
    if (!name) name = randomName();

    var cfg = {
      name: name,
      breed: config.breed,
      coat: config.coat,
      eyes: config.eyes,
      persona: config.persona
    };

    var spawnX = clamp(state.cameraX + state.visibleW * 0.5 + rand(-70, 70), 100, WORLD.w - 100);
    var cat = new Cat(cfg, spawnX, 'floor');
    cat.tagT = 4.2;
    state.cats.push(cat);
    addHearts(cat, 3);
    addDust(cat.x, cat.y, 6);
    updateCounter();
    closeEditor();
    showToast(name + ' теперь живёт в комнате.');
    if (worldAudio) worldAudio.sfx('add');
    hideHint();
  }

  function updatePreviewFromConfig() {
    if (!previewCat) return;
    previewCat.breed = config.breed;
    previewCat.coat = config.coat;
    previewCat.eyes = config.eyes;
    previewCat.persona = config.persona;
  }

  /* ------------------------- preview ------------------------- */

  function resizePreview() {
    var rect = previewCanvas.getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2) return;

    previewDpr = Math.min(2, window.devicePixelRatio || 1);
    previewW = rect.width;
    previewH = rect.height;
    previewCanvas.width = Math.round(previewW * previewDpr);
    previewCanvas.height = Math.round(previewH * previewDpr);
  }

  function drawPreview(dt) {
    if (!state.editorOpen || !config) return;

    var rect = previewCanvas.getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2) return;
    if (Math.abs(rect.width - previewW) > 0.5 || Math.abs(rect.height - previewH) > 0.5) resizePreview();

    var w = previewW;
    var h = previewH;
    if (w < 2 || h < 2) return;

    pctx.setTransform(previewDpr, 0, 0, previewDpr, 0, 0);
    pctx.clearRect(0, 0, w, h);

    var bg = pctx.createRadialGradient(w * 0.5, h * 0.25, 10, w * 0.5, h * 0.45, h * 0.95);
    bg.addColorStop(0, 'rgba(255, 250, 238, 0.75)');
    bg.addColorStop(1, 'rgba(255, 250, 238, 0)');
    pctx.fillStyle = bg;
    pctx.fillRect(0, 0, w, h);

    pctx.save();
    pctx.translate(w * 0.5, h * 0.87);
    pctx.scale(1, 0.26);
    pctx.fillStyle = 'rgba(96, 62, 38, 0.15)';
    pctx.beginPath();
    pctx.arc(0, 0, w * 0.31, 0, TAU);
    pctx.fill();
    pctx.fillStyle = '#c4795a';
    pctx.beginPath();
    pctx.arc(0, 0, w * 0.285, 0, TAU);
    pctx.fill();
    pctx.strokeStyle = 'rgba(246, 231, 207, 0.9)';
    pctx.lineWidth = Math.max(3, w * 0.018);
    pctx.beginPath();
    pctx.arc(0, 0, w * 0.25, 0, TAU);
    pctx.stroke();
    pctx.strokeStyle = 'rgba(246, 231, 207, 0.35)';
    pctx.lineWidth = 1.4;
    pctx.beginPath();
    pctx.arc(0, 0, w * 0.2, 0, TAU);
    pctx.stroke();
    pctx.restore();

    previewCat.x = 0;
    previewCat.y = 0;
    previewCat.dir = 1;
    previewCat.scale = 1;
    previewCat.sit = 1;
    previewCat.loaf = 0;
    previewCat.mode = 'idle';
    previewCat.idlePose = 'sit';
    previewCat.jump = null;
    previewCat.landSquash = 0;
    previewCat.sleepy = false;

    previewBlinkT -= dt;
    if (previewBlinkT <= 0) {
      previewBlink = 1;
      previewBlinkT = rand(2.6, 5.4);
    }
    previewBlink = Math.max(0, previewBlink - dt * 4.5);
    previewCat.blink = previewBlink;
    previewCat.tailPhase += dt * 2.3;

    var catScale = Math.min(w / 200, h / 150);
    pctx.save();
    pctx.translate(w * 0.5, h * 0.87);
    pctx.scale(catScale, catScale);
    drawCat(pctx, previewCat, state.time);
    pctx.restore();
  }

  /* ------------------------- feeding / petting ------------------------- */

  function feed() {
    if (state.bowlFood >= 6) {
      showToast('Миска ещё полная.');
      return;
    }

    state.bowlFood = 6;

    for (var i = 0; i < state.cats.length; i++) {
      var cat = state.cats[i];
      cat.goal = 'bowl';
      cat.slot = null;
      cat.waitT = 0;
      if (cat.mode !== 'jump' && cat.mode !== 'pet' && cat.mode !== 'eat') {
        cat.mode = 'idle';
        cat.stateT = 0.25;
        cat.idlePose = 'sit';
        cat.sleepy = false;
      }
    }

    centerCameraOn(BOWL_X + 20);
    if (worldAudio) worldAudio.sfx('feed');
    if (window.TihonProfile) window.TihonProfile.event('feed');
    hideHint();
  }

  function petCat(cat, worldX) {
    cat.pet(worldX);
    if (worldAudio) worldAudio.sfx('pet');
    if (window.TihonProfile) window.TihonProfile.event('pet');
    hideHint();
  }

  function catAt(wx, wy) {
    var sorted = state.cats.slice().sort(function (a, b) { return b.y - a.y; });
    for (var i = 0; i < sorted.length; i++) {
      var cat = sorted[i];
      var s = cat.scale;
      var h = (cat.loaf > 0.5 ? 64 : 110) * s;
      var w = 54 * s;
      if (wx > cat.x - w && wx < cat.x + w && wy > cat.y - h && wy < cat.y + 9) return cat;
    }
    return null;
  }

  function isBowlAt(wx, wy) {
    return wx > BOWL_X - 82 && wx < BOWL_X + 132 && wy > 672 && wy < 772;
  }

  function screenToWorld(sx, sy) {
    return {
      x: state.cameraX + sx / state.scale,
      y: sy / state.scale
    };
  }

  function updateHoverAtScreen(sx, sy) {
    if (state.editorOpen) return;
    var wp = screenToWorld(sx, sy);
    var cat = catAt(wp.x, wp.y);

    if (cat !== state.hoverCat) {
      if (state.hoverCat) state.hoverCat.hovered = false;
      state.hoverCat = cat;
      if (cat) cat.hovered = true;
    }

    var over = !!cat || isBowlAt(wp.x, wp.y);
    document.body.classList.toggle('over-cat', over);
  }

  function clearHover() {
    if (state.hoverCat) state.hoverCat.hovered = false;
    state.hoverCat = null;
    document.body.classList.remove('over-cat');
  }

  /* ------------------------- pointer ------------------------- */

  function onPointerDown(e) {
    if (state.editorOpen) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    var rect = canvas.getBoundingClientRect();
    var sx = e.clientX - rect.left;
    var sy = e.clientY - rect.top;
    var wp = screenToWorld(sx, sy);

    state.pointerDown = true;
    state.dragging = false;
    state.dragMoved = false;
    state.dragStartX = sx;
    state.dragStartY = sy;
    state.dragStartCam = state.cameraX;
    state.dragCat = catAt(wp.x, wp.y);
    state.dragBowl = isBowlAt(wp.x, wp.y);

    state.pointerInside = true;
    state.pointerX = sx;
    state.pointerY = sy;

    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }

    e.preventDefault();
  }

  function onPointerMove(e) {
    if (state.editorOpen) return;

    var rect = canvas.getBoundingClientRect();
    var sx = e.clientX - rect.left;
    var sy = e.clientY - rect.top;

    state.pointerInside = true;
    state.pointerX = sx;
    state.pointerY = sy;

    if (state.pointerDown) {
      var dx = sx - state.dragStartX;
      var dy = sy - state.dragStartY;
      if (!state.dragMoved && Math.sqrt(dx * dx + dy * dy) > 6) {
        state.dragMoved = true;
        state.dragging = true;
        state.dragCat = null;
        state.dragBowl = false;
        clearHover();
        document.body.classList.add('dragging');
      }
      if (state.dragMoved) {
        state.cameraX = clamp(state.dragStartCam - dx / state.scale, 0, maxCamera());
        state.cameraGoal = state.cameraX;
        hideHint();
      }
    } else {
      updateHoverAtScreen(sx, sy);
    }

    e.preventDefault();
  }

  function finishPointer(e, cancelled) {
    if (!state.pointerDown) return;

    var rect = canvas.getBoundingClientRect();
    var sx = e.clientX - rect.left;
    var sy = e.clientY - rect.top;
    var wasClick = !state.dragMoved && !cancelled;

    if (wasClick) {
      var wp = screenToWorld(sx, sy);
      var cat = catAt(wp.x, wp.y);
      if (cat) petCat(cat, wp.x);
      else if (isBowlAt(wp.x, wp.y)) feed();
    }

    state.pointerDown = false;
    state.dragging = false;
    state.dragMoved = false;
    state.dragCat = null;
    state.dragBowl = false;
    document.body.classList.remove('dragging');

    if (!state.editorOpen && !cancelled) updateHoverAtScreen(sx, sy);
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', function (e) { finishPointer(e, false); });
  canvas.addEventListener('pointercancel', function (e) { finishPointer(e, true); });
  canvas.addEventListener('pointerleave', function () {
    state.pointerInside = false;
    if (!state.pointerDown) clearHover();
  });

  canvas.addEventListener('wheel', function (e) {
    if (state.editorOpen) return;
    e.preventDefault();
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    setCameraGoal(state.cameraGoal + (d * 0.95) / state.scale);
    hideHint();
  }, { passive: false });

  /* ------------------------- buttons & keys ------------------------- */

  addCatBtn.addEventListener('click', openEditor);
  feedBtn.addEventListener('click', feed);
  panLeft.addEventListener('click', function () { panBy(-state.visibleW * 0.6); });
  panRight.addEventListener('click', function () { panBy(state.visibleW * 0.6); });

  document.getElementById('editorClose').addEventListener('click', closeEditor);
  document.getElementById('cancelBtn').addEventListener('click', closeEditor);
  document.getElementById('randomizeBtn').addEventListener('click', function () {
    if (!config) return;
    var fresh = randomConfig();
    config.name = fresh.name;
    config.breed = fresh.breed;
    config.coat = fresh.coat;
    config.eyes = fresh.eyes;
    config.persona = fresh.persona;
    catNameInput.value = config.name;
    syncEditorSelection();
  });
  confirmBtn.addEventListener('click', confirmAdd);

  catNameInput.addEventListener('input', function () {
    if (config) config.name = catNameInput.value;
  });

  catNameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      confirmAdd();
    }
  });

  editorEl.addEventListener('click', function (e) {
    if (e.target === editorEl) closeEditor();
  });

  window.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName ? e.target.tagName : '';
    var typing = tag === 'INPUT' || tag === 'TEXTAREA';

    if (state.editorOpen) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeEditor();
      }
      return;
    }

    if (typing) return;

    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') {
      state.keys.left = true;
      e.preventDefault();
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') {
      state.keys.right = true;
      e.preventDefault();
    } else if (e.code === 'Space' && tag !== 'BUTTON') {
      e.preventDefault();
      feed();
    } else if (e.key === 'c' || e.key === 'C' || e.key === 'с' || e.key === 'С') {
      openEditor();
    } else if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') {
      feed();
    }
  });

  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') state.keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') state.keys.right = false;
  });

  window.addEventListener('blur', function () {
    state.keys.left = false;
    state.keys.right = false;
    state.pointerDown = false;
    state.dragging = false;
    state.dragMoved = false;
    document.body.classList.remove('dragging');
  });

  /* ------------------------- ambient dust, resize, render ------------------------- */

  function initDust() {
    state.dust.length = 0;
    for (var i = 0; i < 34; i++) {
      state.dust.push({
        x: rand(360, 1080),
        y: rand(240, 860),
        vy: rand(-5.5, -1.4),
        drift: rand(3, 9),
        phase: rand(0, TAU),
        r: rand(0.7, 2.1),
        a: rand(0.07, 0.22)
      });
    }
  }

  function updateDust(dt) {
    for (var i = 0; i < state.dust.length; i++) {
      var d = state.dust[i];
      d.y += d.vy * dt;
      d.x += Math.sin(state.time * 0.35 + d.phase) * d.drift * dt;
      if (d.y < 220) {
        d.y = 880;
        d.x = rand(360, 1080);
      }
    }
  }

  function drawDust() {
    ctx.save();
    ctx.fillStyle = '#fff0c6';
    for (var i = 0; i < state.dust.length; i++) {
      var d = state.dust[i];
      ctx.globalAlpha = d.a;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function resize() {
    state.w = Math.max(320, window.innerWidth);
    state.h = Math.max(320, window.innerHeight);
    state.dpr = Math.min(1.75, window.devicePixelRatio || 1);
    state.scale = state.h / WORLD.h;
    state.visibleW = state.w / state.scale;

    canvas.width = Math.round(state.w * state.dpr);
    canvas.height = Math.round(state.h * state.dpr);
    canvas.style.width = state.w + 'px';
    canvas.style.height = state.h + 'px';

    buildRoomBackground();

    if (!state.cameraReady) {
      var startX = state.visibleW < 900 ? 900 - state.visibleW / 2 : 0;
      state.cameraX = clamp(startX, 0, maxCamera());
      state.cameraGoal = state.cameraX;
      state.cameraReady = true;
    } else {
      clampCamera();
    }

    if (state.editorOpen) {
      resizePreview();
    }
    updatePanButtons();
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resize();
      resizeTimer = null;
    }, 140);
  });

  function render() {
    var sc = state.scale;
    var dpr = state.dpr;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#e8d7bf';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.setTransform(sc * dpr, 0, 0, sc * dpr, -state.cameraX * sc * dpr, 0);
    ctx.imageSmoothingEnabled = true;
    if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(roomBg, 0, 0, WORLD.w, WORLD.h);

    drawDust();
    drawBowl(ctx);

    var sorted = state.cats.slice().sort(function (a, b) { return a.y - b.y; });
    for (var i = 0; i < sorted.length; i++) {
      drawCatShadow(ctx, sorted[i]);
      drawCat(ctx, sorted[i], state.time);
    }

    for (var j = 0; j < sorted.length; j++) {
      drawNameTag(ctx, sorted[j]);
    }

    drawParticles(ctx);
  }

  /* ------------------------- initial cats ------------------------- */

  function addStarterCats() {
    state.cats.push(new Cat({
      name: 'Барсик', breed: 'domestic', coat: 'tabby', eyes: 'amber', persona: 'playful'
    }, 812, 'sofaSeat'));

    state.cats.push(new Cat({
      name: 'Муся', breed: 'british', coat: 'gray', eyes: 'green', persona: 'lazy'
    }, 342, 'bench'));

    state.cats.push(new Cat({
      name: 'Рыжик', breed: 'maine', coat: 'ginger', eyes: 'copper', persona: 'cuddly'
    }, 986, 'floor'));
  }

  function init() {
    buildEditorOptions();

    previewCat = {
      name: '',
      breed: 'domestic',
      coat: 'ginger',
      eyes: 'amber',
      persona: 'playful',
      scale: 1,
      x: 0,
      y: 0,
      dir: 1,
      mode: 'idle',
      idlePose: 'sit',
      sit: 1,
      loaf: 0,
      blink: 0,
      tailPhase: 0,
      walkPhase: 0,
      landSquash: 0,
      eatPhase: 0,
      jump: null,
      sleepy: false,
      hovered: false,
      tagT: 0
    };

    resize();
    addStarterCats();
    updateCounter();
    initDust();

    hintTimer = setTimeout(hideHint, 16000);

    window.__catroom = {
      state: state,
      platforms: platforms,
      feed: feed,
      petCat: petCat,
      openEditor: openEditor,
      closeEditor: closeEditor
    };

    requestAnimationFrame(frame);
  }

  var lastFrame = 0;

  function frame(now) {
    if (!lastFrame) lastFrame = now;
    var dt = clamp((now - lastFrame) / 1000, 0.001, 0.05);
    lastFrame = now;
    state.time += dt;

    updateCamera(dt);

    for (var i = 0; i < state.cats.length; i++) {
      state.cats[i].update(dt);
    }

    updateParticles(dt);
    updateDust(dt);

    if (!state.editorOpen) {
      if (state.pointerInside && !state.dragging) {
        updateHoverAtScreen(state.pointerX, state.pointerY);
      } else if (!state.pointerInside && state.hoverCat) {
        clearHover();
      }
    }

    render();

    if (state.editorOpen) drawPreview(dt);

    requestAnimationFrame(frame);
  }

  init();

})();
</script>
</body>
</html>
